<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raport Tickete</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pr:#4a90e2;--bg:#f5f5f1;--su:#fff;--tx:#1a1a1a;--t2:#666;--br:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--su:#2d2d2d;--tx:#fff;--t2:#999;--br:#444}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:16px}
.wrap{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:26px;color:var(--pr);margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sc{background:var(--su);padding:16px;border-radius:8px;border:1px solid var(--br);text-align:center}
.sv{font-size:26px;font-weight:700;color:var(--pr)}
.sl{font-size:11px;color:var(--t2);margin-top:6px;text-transform:uppercase}
.sec{margin-bottom:20px}
.sec-title{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.card{background:var(--su);padding:10px;border-radius:6px;border:2px solid var(--br);text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.card:hover{border-color:var(--pr);transform:translateY(-1px)}
.card.on{border-color:var(--pr);background:rgba(74,144,226,.12);box-shadow:0 0 0 2px rgba(74,144,226,.25)}
.cv{font-size:20px;font-weight:700;color:var(--pr)}
.cl{font-size:11px;color:var(--t2);margin-top:4px}
.fbar{display:none;background:rgba(74,144,226,.08);border:1px solid rgba(74,144,226,.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;align-items:center;justify-content:space-between;gap:8px}
.fbar.on{display:flex}
.fbar span{color:var(--pr);font-weight:500}
.fbar button{background:none;border:1px solid var(--pr);border-radius:6px;padding:4px 10px;color:var(--pr);cursor:pointer;font-size:12px}
.tw{background:var(--su);border-radius:8px;border:1px solid var(--br);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:rgba(74,144,226,.05);position:sticky;top:0;z-index:5}
th{padding:10px 12px;text-align:left;font-weight:600;color:var(--pr);border-bottom:1px solid var(--br);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--br)}
tr:hover td{background:rgba(74,144,226,.04)}
.tlink{color:var(--pr);cursor:pointer;font-weight:700;text-decoration:underline}
.cp{cursor:pointer}
.cp:hover{background:rgba(74,144,226,.08)!important}
.copied{background:rgba(76,175,80,.2)!important;color:#4caf50!important}
.empty{text-align:center;padding:24px;color:var(--t2);font-style:italic}
#ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:100;justify-content:center;align-items:center;padding:16px}
#ov.on{display:flex}
#pan{background:var(--su);border-radius:12px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--br);position:sticky;top:0;background:var(--su)}
.ph h2{font-size:15px;color:var(--pr)}
.xb{background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2);padding:2px 6px;border-radius:4px}
.xb:hover{background:var(--br)}
.pb{padding:14px 18px}
.fr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--br);align-items:flex-start}
.fr:last-child{border-bottom:none}
.fl{font-size:11px;color:var(--t2);text-transform:uppercase;min-width:125px;flex-shrink:0;padding-top:2px}
.fv{font-size:14px;line-height:1.5;word-break:break-word;cursor:pointer;flex:1;color:var(--tx)}
.fv:hover{color:var(--pr)}
.fv.em{color:var(--t2);font-style:italic;cursor:default}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;background:rgba(74,144,226,.15);color:var(--pr);font-weight:500}
.msg{text-align:center;padding:60px;color:var(--t2);font-size:18px}
.rezolvat-btn{background:#4caf50;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;transition:all .2s}
.rezolvat-btn:hover{background:#388e3c}
.rezolvat-btn.done{background:#9e9e9e;cursor:default}
tr.rezolvat td{background:rgba(76,175,80,.08)!important;color:#388e3c}
/* Panel rezolvat */
#rez-ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:200;justify-content:center;align-items:center;padding:16px}
#rez-ov.on{display:flex}
#rez-pan{background:var(--su);border-radius:12px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.rez-header{padding:16px 20px;border-bottom:1px solid var(--br);background:#4caf50;border-radius:12px 12px 0 0}
.rez-header h2{color:#fff;font-size:16px;margin:0}
.rez-body{padding:20px}
.rez-info{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.3);border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;line-height:1.8}
.rez-info strong{color:#388e3c}
.rez-actions{display:flex;flex-direction:column;gap:10px}
.rez-actions button{padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#1da851}
.btn-sheet{background:#4285f4;color:#fff}
.btn-sheet:hover{background:#2a6dd9}
.btn-both{background:linear-gradient(135deg,#25D366,#4285f4);color:#fff}
.btn-both:hover{opacity:.9}
.btn-cancel{background:var(--br);color:var(--tx)}
.rez-status{font-size:12px;color:var(--t2);margin-top:10px;text-align:center;min-height:20px}
.setup-ask{max-width:400px;margin:40px auto;background:var(--su);border:1px solid var(--br);border-radius:10px;padding:24px;text-align:center}
.setup-ask p{color:var(--t2);font-size:13px;margin-bottom:16px}
.setup-ask input{width:100%;padding:10px;border:1px solid var(--br);border-radius:6px;font-size:12px;font-family:monospace;margin-bottom:10px;color:var(--tx);background:var(--bg)}
button{padding:10px 16px;border:1px solid var(--br);border-radius:6px;background:var(--su);color:var(--tx);cursor:pointer;font-size:13px;font-weight:500}
button.primary{background:var(--pr);color:#fff;border-color:var(--pr);width:100%}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎫 Raport Tickete</h1>
  <div id="root"><div class="msg">⏳ Se încarcă...</div></div>
</div>
<div id="ov">
  <div id="pan">
    <div class="ph"><h2 id="ptitle">Detalii</h2><button class="xb" id="xbtn">✕</button></div>
    <div class="pb" id="pbody"></div>
  </div>
</div>
<!-- Panel Rezolvat -->
<div id="rez-ov">
  <div id="rez-pan">
    <div class="rez-header"><h2>✅ Marchează ca Rezolvat</h2></div>
    <div class="rez-body">
      <div class="rez-info" id="rez-info"></div>
      <div class="rez-actions">
        <button class="btn-both" onclick="rezolvatAmbele()">💬 WhatsApp + 📊 Google Sheets</button>
        <button class="btn-wa" onclick="rezolvatWA()">💬 Doar WhatsApp</button>
        <button class="btn-sheet" onclick="rezolvatSheet()">📊 Doar Google Sheets</button>
        <button class="btn-cancel" onclick="closeRezolvat()">Anulează</button>
      </div>
      <div class="rez-status" id="rez-status"></div>
    </div>
  </div>
</div>

<script>
var DATA=[], activeType=null, activeLoc=null;
var SCRIPT_URL = localStorage.getItem('gas_url') || 'https://script.google.com/macros/s/AKfycbw4zleUzJHeodIbEclPlrUitNB8-vBNg16qMpbERNqNpfVXk1tyoCO6XxWw5fYVCAri/exec';

function s(v){return (v||'').toString();}
function cp(txt,el){var done=function(){el.classList.add('copied');setTimeout(function(){el.classList.remove('copied');},700);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(function(){fb(txt);done();});}else{fb(txt);done();}}
function fb(txt){var t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}
document.getElementById('xbtn').onclick=function(){document.getElementById('ov').className='';};
document.getElementById('ov').onclick=function(e){if(e.target===this)this.className='';};

function openPanel(i){
  var r=DATA[i];if(!r)return;
  document.getElementById('ptitle').textContent='Ticket #'+s(r.t);
  var fields=[['Numar ticket',r.t,false],['Account',r.a,false],['Beneficiara',r.b,false],['Obiectiv',r.ob,false],['Localitate',r.l,false],['Adresa',r.ad,false],['Judet',r.j,false],['Tip ticket',r.ty,true],['Data initiere',r.d,false],['Data programata',r.dp,false],['Nota',r.n,false]];
  var html='';
  for(var k=0;k<fields.length;k++){
    var lbl=fields[k][0],val=s(fields[k][1]),badge=fields[k][2],vh;
    if(!val){vh='<span class="fv em">—</span>';}
    else if(badge){vh='<span class="fv"><span class="badge">'+val+'</span></span>';}
    else{vh='<span class="fv" data-val="'+val.replace(/"/g,'&quot;')+'">'+val.replace(/\n/g,'<br>')+'</span>';}
    html+='<div class="fr"><span class="fl">'+lbl+'</span>'+vh+'</div>';
  }
  document.getElementById('pbody').innerHTML=html;
  document.querySelectorAll('#pbody .fv[data-val]').forEach(function(el){el.onclick=function(){cp(el.getAttribute('data-val'),el);};});
  document.getElementById('ov').className='on';
}

function filtered(){return DATA.filter(function(r){return (!activeType||(r.ty||'?')===activeType)&&(!activeLoc||(r.l||'')===activeLoc);});}
function toggleType(type){activeType=(activeType===type)?null:type;document.querySelectorAll('#typeGrid .card').forEach(function(el){el.className='card'+(el.getAttribute('data-type')===activeType?' on':'');});updateTable();}
function toggleLoc(loc){activeLoc=(activeLoc===loc)?null:loc;document.querySelectorAll('#locGrid .card').forEach(function(el){el.className='card'+(el.getAttribute('data-loc')===activeLoc?' on':'');});updateTable();}
function clearFilters(){activeType=null;activeLoc=null;document.querySelectorAll('.card').forEach(function(el){el.className='card';});updateTable();}

function updateTable(){
  var src=filtered();
  var rows=src.map(function(r){var i=DATA.indexOf(r);var done=r._rezolvat?'done':'';var rowCls=r._rezolvat?' class="rezolvat"':'';return '<tr'+rowCls+'><td><span class="tlink" data-idx="'+i+'">'+s(r.t)+'</span><br><button class="rezolvat-btn '+done+'" data-idx="'+i+'" '+(r._rezolvat?'disabled':'')+'>'+( r._rezolvat?'✓ Rezolvat':'✅ Rezolvat')+'</button></td><td class="cp">'+s(r.a)+'</td><td class="cp">'+s(r.b)+'</td><td class="cp">'+s(r.l)+'</td><td class="cp">'+s(r.ty)+'</td><td class="cp">'+s(r.d)+'</td><td class="cp">'+s(r.dp)+'</td></tr>';}).join('');
  document.querySelector('#root tbody').innerHTML=rows||'<tr><td colspan="7" class="empty">Nu există tickete pentru filtrul selectat</td></tr>';
  document.querySelectorAll('.tlink').forEach(function(el){el.onclick=function(){openPanel(parseInt(el.getAttribute('data-idx')));};});
  document.querySelectorAll('td.cp').forEach(function(el){el.onclick=function(){cp(el.textContent||el.innerText,el);};});
  document.querySelectorAll('.rezolvat-btn:not(.done)').forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();openRezolvat(parseInt(btn.getAttribute('data-idx')));};
  });
  var parts=[];if(activeType)parts.push('Tip: '+activeType);if(activeLoc)parts.push('Localitate: '+activeLoc);
  var fbar=document.getElementById('fbar');fbar.className=parts.length?'fbar on':'fbar';
  document.getElementById('fbar-text').textContent='🔍 '+parts.join(' | ')+' ('+src.length+' tickete)';
}

function render(data){
  DATA=data;
  if(!data||!data.length){document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Nu există date</div>';return;}
  var acc={},loc={},cnt={};
  data.forEach(function(r){if(r.a)acc[r.a]=1;if(r.l)loc[r.l]=(loc[r.l]||0)+1;var t=r.ty||'?';cnt[t]=(cnt[t]||0)+1;});
  var locs=Object.keys(loc).sort();
  var locsHtml=locs.map(function(l){return '<div class="card" data-loc="'+l+'"><div class="cv">'+loc[l]+'</div><div class="cl">'+l+'</div></div>';}).join('');
  var types=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  var typesHtml=types.map(function(t){return '<div class="card" data-type="'+t+'"><div class="cv">'+cnt[t]+'</div><div class="cl">'+t+'</div></div>';}).join('');
  var rows=data.map(function(r,i){var done=r._rezolvat?'done':'';var rowCls=r._rezolvat?' class="rezolvat"':'';return '<tr'+rowCls+'><td><span class="tlink" data-idx="'+i+'">'+s(r.t)+'</span><br><button class="rezolvat-btn '+done+'" data-idx="'+i+'" '+(r._rezolvat?'disabled':'')+'>'+( r._rezolvat?'✓ Rezolvat':'✅ Rezolvat')+'</button></td><td class="cp">'+s(r.a)+'</td><td class="cp">'+s(r.b)+'</td><td class="cp">'+s(r.l)+'</td><td class="cp">'+s(r.ty)+'</td><td class="cp">'+s(r.d)+'</td><td class="cp">'+s(r.dp)+'</td></tr>';}).join('');
  document.getElementById('root').innerHTML=
    '<div class="grid3"><div class="sc"><div class="sv">'+data.length+'</div><div class="sl">Total Tickete</div></div><div class="sc"><div class="sv">'+Object.keys(acc).length+'</div><div class="sl">Conturi</div></div><div class="sc"><div class="sv">'+locs.length+'</div><div class="sl">Localități</div></div></div>'+
    '<div class="sec"><div class="sec-title">🏙 Localități — apasă pentru filtrare</div><div class="cards" id="locGrid">'+locsHtml+'</div></div>'+
    '<div class="sec"><div class="sec-title">🏷 Tipuri — apasă pentru filtrare</div><div class="cards" id="typeGrid">'+typesHtml+'</div></div>'+
    '<div class="fbar" id="fbar"><span id="fbar-text"></span><button onclick="clearFilters()">✕ Elimină filtru</button></div>'+
    '<div class="tw"><table><thead><tr><th>Ticket</th><th>Account</th><th>Beneficiara</th><th>Localitate</th><th>Tip</th><th>Data initiere</th><th>Data programata</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  document.querySelectorAll('#locGrid .card').forEach(function(el){el.onclick=function(){toggleLoc(el.getAttribute('data-loc'));};});
  document.querySelectorAll('#typeGrid .card').forEach(function(el){el.onclick=function(){toggleType(el.getAttribute('data-type'));};});
  document.querySelectorAll('.tlink').forEach(function(el){el.onclick=function(){openPanel(parseInt(el.getAttribute('data-idx')));};});
  document.querySelectorAll('td.cp').forEach(function(el){el.onclick=function(){cp(el.textContent||el.innerText,el);};});
}

function fetchData(id, url){
  var fullUrl = url + '?id=' + id;
  document.getElementById('root').innerHTML='<div class="msg">⏳ Se conectează la server...</div>';
  fetch(fullUrl, {redirect: 'follow', mode: 'cors'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text){
      var data = JSON.parse(text);
      if(data && data.error){
        document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date negăsite (id: '+id+'). Generează un link nou.</div>';
      } else if(Array.isArray(data) && data.length > 0){
        render(data);
      } else {
        document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date invalide. Răspuns: '+text.substring(0,100)+'</div>';
      }
    })
    .catch(function(e){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Eroare conexiune: '+e.message+'<br><small>URL: '+fullUrl+'</small></div>';
    });
}

// ── GOOGLE SHEETS ID ─────────────────────────────────────
// Completează după ce creezi sheet-ul (vezi instrucțiuni)
var SHEET_ID = localStorage.getItem('sheet_id') || '1feTSTO4FCFTUJBxiD0rd2ICF30jZE9pX6oihHxznkAY';
var currentRezIdx = null;

function openRezolvat(i){
  var r = DATA[i];
  if(!r) return;
  currentRezIdx = i;
  var ora = new Date().toLocaleString('ro-RO');
  document.getElementById('rez-info').innerHTML =
    '<strong>Ticket:</strong> ' + s(r.t) + '<br>' +
    '<strong>Beneficiar:</strong> ' + s(r.b) + '<br>' +
    '<strong>Adresă:</strong> ' + s(r.ad) + '<br>' +
    '<strong>Localitate:</strong> ' + s(r.l) + '<br>' +
    '<strong>Tip:</strong> ' + s(r.ty) + '<br>' +
    '<strong>Data programată:</strong> ' + s(r.dp) + '<br>' +
    '<strong>Data rezolvare:</strong> ' + ora;
  document.getElementById('rez-status').textContent = '';
  document.getElementById('rez-ov').className = 'on';
}

function closeRezolvat(){
  document.getElementById('rez-ov').className = '';
  currentRezIdx = null;
}

document.getElementById('rez-ov').onclick = function(e){
  if(e.target === this) closeRezolvat();
};

function buildWAMessage(r){
  var ora = new Date().toLocaleString('ro-RO');
  return '✅ *TICKET REZOLVAT*' +
    '\n\n🎫 Ticket: ' + s(r.t) +
    '\n👤 Beneficiar: ' + s(r.b) +
    '\n📍 Adresă: ' + s(r.ad) + ', ' + s(r.l) +
    '\n🔧 Tip: ' + s(r.ty) +
    '\n📅 Data programată: ' + s(r.dp) +
    '\n⏰ Rezolvat la: ' + ora;
}

function logToSheet(r, callback){
  if(!SHEET_ID){
    document.getElementById('rez-status').textContent = '⚠️ Sheet ID lipsă — configurează în setări';
    if(callback) callback(false);
    return;
  }
  var ora = new Date().toLocaleString('ro-RO');
  var row = [s(r.t), s(r.b), s(r.ad), s(r.l), s(r.ty), s(r.dp), ora];
  var url = SCRIPT_URL + '?action=sheet&sid=' + encodeURIComponent(SHEET_ID) +
    '&row=' + encodeURIComponent(JSON.stringify(row));
  fetch(url)
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data.ok){
        document.getElementById('rez-status').textContent = '✓ Salvat în Google Sheets';
        if(callback) callback(true);
      } else {
        document.getElementById('rez-status').textContent = '❌ Eroare Sheets: ' + (data.error||'necunoscut');
        if(callback) callback(false);
      }
    })
    .catch(function(e){
      document.getElementById('rez-status').textContent = '❌ Eroare: ' + e.message;
      if(callback) callback(false);
    });
}

function markRezolvat(idx){
  DATA[idx]._rezolvat = true;
  updateTable();
}

function rezolvatWA(){
  var r = DATA[currentRezIdx];
  var msg = buildWAMessage(r);
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  markRezolvat(currentRezIdx);
  closeRezolvat();
}

function rezolvatSheet(){
  var r = DATA[currentRezIdx];
  var idx = currentRezIdx;
  document.getElementById('rez-status').textContent = '⏳ Se salvează...';
  logToSheet(r, function(ok){
    if(ok) markRezolvat(idx);
  });
}

function rezolvatAmbele(){
  var r = DATA[currentRezIdx];
  var idx = currentRezIdx;
  // WA
  var msg = buildWAMessage(r);
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  // Sheets
  document.getElementById('rez-status').textContent = '⏳ Se salvează în Sheets...';
  logToSheet(r, function(ok){
    if(ok){
      markRezolvat(idx);
      setTimeout(function(){ closeRezolvat(); }, 1500);
    }
  });
}

function load(){
  var params=new URLSearchParams(window.location.search);
  var id=params.get('id');
  if(!id){document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Link invalid</div>';return;}
  if(SCRIPT_URL){
    fetchData(id, SCRIPT_URL);
  } else {
    // Cere URL-ul script-ului
    document.getElementById('root').innerHTML=
      '<div class="setup-ask">'+
      '<p>🔑 Introdu URL-ul Google Apps Script pentru a accesa datele:</p>'+
      '<input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">'+
      '<button class="primary" id="urlBtn">Accesează datele</button>'+
      '</div>';
    document.getElementById('urlBtn').onclick=function(){
      var url=document.getElementById('urlInput').value.trim();
      if(!url)return;
      SCRIPT_URL=url;
      localStorage.setItem('gas_url',url);
      document.getElementById('root').innerHTML='<div class="msg">⏳ Se încarcă...</div>';
      fetchData(id,url);
    };
  }
}
load();
</script>
</body>
</html>
