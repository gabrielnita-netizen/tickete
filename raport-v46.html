<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Raport Tickete</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F4F3; --su:#FFFFFF;
  --tx:#06141B; --t2:#4A5C6A; --t3:#9BA8AB;
  --br:#CCD0CF; --br-lt:#E5E9E8;
  --pr:#253745; --pr-lt:#DDE3E6;
  --em:#253745; --em-lt:#DDE3E6;
  --or:#4A5C6A; --or-lt:#E5E9E8;
  --rd:#06141B; --rd-lt:#CCD0CF;
  --bl:#253745; --bl-lt:#DDE3E6;
  --pk:#4A5C6A; --pk-lt:#E5E9E8;
  --pu:#253745; --pu-lt:#DDE3E6;
  --yl:#4A5C6A; --yl-lt:#E5E9E8;
  --tl:#253745; --tl-lt:#DDE3E6;
  --check-green:#4A5C6A;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#06141B; --su:#11212D;
  --tx:#CCD0CF; --t2:#9BA8AB; --t3:#4A5C6A;
  --br:#253745; --br-lt:#1A2B37;
  --pr:#9BA8AB; --pr-lt:#253745;
  --em:#9BA8AB; --em-lt:#253745;
  --or:#9BA8AB; --or-lt:#253745;
  --rd:#CCD0CF; --rd-lt:#253745;
  --bl:#9BA8AB; --bl-lt:#253745;
  --pk:#9BA8AB; --pk-lt:#253745;
  --pu:#9BA8AB; --pu-lt:#253745;
  --yl:#9BA8AB; --yl-lt:#253745;
  --tl:#9BA8AB; --tl-lt:#253745;
  --check-green:#CCD0CF;
}}

body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;background:var(--bg);color:var(--tx);padding:24px 18px;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.wrap{max-width:900px;margin:0 auto}

h1{text-align:left;font-size:36px;font-weight:800;color:var(--tx);margin-bottom:6px;letter-spacing:-1.2px;line-height:1.1}
.subtitle{color:var(--t2);font-size:16px;margin-bottom:28px;font-weight:400;letter-spacing:-.2px}

/* Stats — playful cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.sc{padding:20px 18px;border-radius:28px;text-align:left;transition:transform .15s ease;background:var(--su);border:1px solid var(--br)}
.sc:nth-child(1),.sc:nth-child(2),.sc:nth-child(3){background:var(--su)}
.sc:active{transform:scale(.97)}
.sv{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.7px;color:var(--tx)}
.sc:nth-child(1) .sv,.sc:nth-child(2) .sv,.sc:nth-child(3) .sv{color:var(--tx)}
.sl{font-size:13px;color:var(--tx);margin-top:8px;font-weight:600;letter-spacing:-.1px;opacity:.75}

/* Buton harta — big rounded pill */
.map-btn{background:var(--tx);color:var(--bg);border:none;border-radius:28px;padding:18px 24px;font-size:17px;font-weight:700;cursor:pointer;width:100%;letter-spacing:-.3px;transition:all .15s ease;display:flex;align-items:center;justify-content:center;gap:10px}
.map-btn:active{transform:scale(.98);opacity:.85}

/* Progress bar rezolvate */
.progress-wrap{margin-bottom:24px;background:var(--su);border-radius:20px;padding:16px 18px;border:1px solid var(--br)}
.progress-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.progress-text{font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.2px}
.progress-filter{background:var(--br-lt);color:var(--tx);border:none;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:background-color .2s ease,color .2s ease,transform .15s ease;letter-spacing:-.1px}
.progress-filter:active{transform:scale(.94)}
.progress-filter.on{background:var(--tx);color:var(--bg)}
.progress-bar{height:8px;background:var(--br-lt);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--tx);border-radius:100px;transition:width .5s cubic-bezier(.34,1.3,.64,1)}

/* Search + Sort */
.search-sort-wrap{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-input-wrap{flex:1;min-width:220px;position:relative;display:flex;align-items:center;background:var(--su);border:1px solid var(--br);border-radius:100px;padding:0 14px;transition:border-color .2s ease}
.search-input-wrap:focus-within{border-color:var(--tx)}
.search-icon{color:var(--t2);flex-shrink:0;margin-right:8px}
#searchInput{flex:1;border:none;outline:none;padding:14px 0;font-size:15px;background:transparent;color:var(--tx);font-family:inherit;letter-spacing:-.2px;min-width:0}
#searchInput::placeholder{color:var(--t3)}
.search-clear{background:var(--br-lt);border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--t2);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.search-clear:active{transform:scale(.9)}
.sort-select{background:var(--su);border:1px solid var(--br);border-radius:100px;padding:14px 18px;font-size:15px;color:var(--tx);cursor:pointer;font-family:inherit;font-weight:600;letter-spacing:-.15px;outline:none;transition:border-color .2s ease;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath d='M1 1l5 5 5-5' stroke='%23888' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 16px center;padding-right:38px;min-width:180px}
.sort-select:focus{border-color:var(--tx)}

/* Group headers in table */
tr.group-header td{padding:0!important;border:none!important;background:transparent!important}
.group-header-inner{background:var(--br-lt);color:var(--tx);padding:10px 20px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;border-radius:0;margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center}
.group-count{font-size:12px;color:var(--t2);font-weight:600;text-transform:none;letter-spacing:0}
tr.group-header:first-child .group-header-inner{margin-top:0}
@media(max-width:720px){
  .group-header-inner{border-radius:100px;margin:12px 0 8px;padding:10px 16px}
}

/* Section titles */
.sec{margin-bottom:28px}
.sec-title{font-size:22px;color:var(--tx);letter-spacing:-.5px;margin-bottom:14px;font-weight:800;text-transform:none}

/* Chip-uri categorii — monocrom */
.cards{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--su);padding:14px 18px;border-radius:100px;border:1px solid var(--br);cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1);user-select:none;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.2px;min-height:48px}
.card:active{transform:scale(.92)}
.card.on{background:var(--tx);color:var(--bg);border-color:var(--tx);animation:chipPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes chipPop{
  0%{transform:scale(.9)}
  60%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.cv{font-size:14px;font-weight:800;color:var(--t2);background:var(--br-lt);padding:3px 10px;border-radius:100px;min-width:26px;text-align:center;letter-spacing:0;transition:background-color .2s ease,color .2s ease}
.card.on .cv{background:rgba(255,255,255,.15);color:var(--bg)}

/* Elimina culori per tip - totul monocrom */
.card[data-type]{background:var(--su);color:var(--tx);border:1px solid var(--br)}
.card[data-type].on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#locGrid .card{background:var(--su);color:var(--tx);border:1px solid var(--br)}
#locGrid .card.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#locGrid .cv{background:var(--br-lt);color:var(--t2)}
#locGrid .card.on .cv{background:rgba(255,255,255,.15);color:var(--bg)}

/* Filter bar */
.fbar{display:none;background:var(--br-lt);border-radius:20px;padding:14px 18px;margin-bottom:20px;font-size:15px;align-items:center;justify-content:space-between;gap:12px}
.fbar.on{display:flex}
.fbar span{color:var(--tx);font-weight:600;letter-spacing:-.2px}
.fbar button{background:var(--tx);border:none;border-radius:100px;padding:8px 16px;color:var(--bg);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:-.1px}

/* Tabel — pentru desktop */
.tw{background:var(--su);border-radius:28px;overflow:hidden;border:1px solid var(--br)}
.tw > div{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
thead{background:var(--br-lt)}
th{padding:16px 20px;text-align:left;font-weight:700;color:var(--t2);border-bottom:1px solid var(--br);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:16px 20px;border-bottom:1px solid var(--br-lt);color:var(--tx);letter-spacing:-.15px;font-weight:500}
tr:last-child td{border-bottom:none}
tr:active td{background:var(--br-lt)}

.tlink{color:var(--pr);cursor:pointer;font-weight:800;font-size:16px;text-decoration:none;letter-spacing:-.3px}
.tlink:active{opacity:.6}

/* BUTON REZOLVAT — mono cu check verde discret */
.rezolvat-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--br-lt);color:var(--t2);border:none;border-radius:100px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:background-color .3s ease,color .3s ease,transform .15s ease;min-height:40px;white-space:nowrap;letter-spacing:-.2px}
.rezolvat-btn:active{transform:scale(.94)}
.rezolvat-btn.done{background:var(--tx);color:var(--bg);animation:doneBounce .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes doneBounce{
  0%{transform:scale(1)}
  30%{transform:scale(.9)}
  60%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.rez-check{width:16px;height:16px;border:2px solid currentColor;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;transition:background-color .3s ease,border-color .3s ease}
.rezolvat-btn.done .rez-check{background:var(--bg);border-color:var(--bg)}
.rez-check-mark{display:none;color:var(--tx);font-size:10px;font-weight:900;line-height:1}
.rezolvat-btn.done .rez-check-mark{display:block;animation:checkPop .35s cubic-bezier(.34,1.8,.64,1) .1s both}
@keyframes checkPop{
  0%{transform:scale(0)}
  60%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

/* Rezolvat: doar butonul se schimba, nu tot randul */
tr.rezolvat td{background:transparent}
tr.nerezolvat td{background:rgba(255,152,0,0.05);opacity:0.85}
tr.nerezolvat td:first-child{border-left:3px solid #FF9800}

.cp{cursor:pointer}
.cp:active{background:var(--br-lt)!important}
.copied{color:var(--em)!important;font-weight:700!important}

.empty{text-align:center;padding:60px 20px;color:var(--t2);font-size:15px}
.msg{text-align:center;padding:100px 20px;color:var(--t2);font-size:17px;font-weight:500;letter-spacing:-.2px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--br);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal sheet — burst animation din punctul de click */
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,10,5,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);z-index:300;justify-content:center;align-items:center;padding:16px;opacity:0;transition:opacity .3s ease}
.modal-bg.on{display:flex;opacity:1}
#ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,10,5,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);z-index:100;justify-content:center;align-items:flex-end;padding:0;opacity:0;transition:opacity .35s ease}
#ov.on{display:flex;opacity:1}
#pan{background:var(--su);border-radius:28px 28px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;position:relative;
  --burst-x:50%;--burst-y:0;--burst-r:0;
  clip-path:circle(var(--burst-r) at var(--burst-x) var(--burst-y));
  -webkit-clip-path:circle(var(--burst-r) at var(--burst-x) var(--burst-y));
  transition:clip-path .9s cubic-bezier(.22,1,.36,1),-webkit-clip-path .9s cubic-bezier(.22,1,.36,1)}
#pan::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:5px;background:var(--br);border-radius:100px;opacity:.7}
#ov.on #pan{--burst-r:150%}
#ov.closing{opacity:0;transition:opacity .5s ease}
#pan.closing{transform:translateY(100%);transition:transform .55s cubic-bezier(.32,.72,0,1)}
@media(min-width:640px){
  #pan.closing{transform:scale(.85);opacity:0;transition:transform .5s ease,opacity .5s ease}
}
@media(min-width:640px){
  #ov{align-items:center;padding:24px}
  #pan{border-radius:28px}
  #pan::before{display:none}
}
.ph{display:flex;justify-content:space-between;align-items:center;padding:26px 24px 18px;position:sticky;top:0;background:var(--su);z-index:2}
.ph h2{font-size:22px;color:var(--tx);font-weight:800;letter-spacing:-.5px}
.xb{background:var(--br-lt);border:none;font-size:16px;cursor:pointer;color:var(--t2);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;line-height:1;padding:0;transition:transform .15s ease}
.xb:active{background:var(--br);transform:scale(.9)}
.pb{padding:0 24px 24px}

/* Scan section - buton si docs uploadate */
.pan-scan-wrap{padding:0 24px 20px}
.pan-scan-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--br-lt);color:var(--tx);border:2px dashed var(--br);border-radius:16px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;min-height:52px;letter-spacing:-.2px;transition:background-color .2s ease,border-color .2s ease,transform .15s ease}
.pan-scan-btn:active{transform:scale(.98)}
.pan-scan-btn:hover{background:var(--su);border-color:var(--tx);border-style:solid}
.pan-docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.pan-docs:empty{margin-top:0}
.pan-doc-item{position:relative;aspect-ratio:1/1.3;background:var(--br-lt);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s ease;border:1px solid var(--br)}
.pan-doc-item:active{transform:scale(.96)}
.pan-doc-thumb{width:100%;height:100%;object-fit:cover;display:block}
.pan-doc-pdf{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--pr);font-weight:700;background:linear-gradient(135deg,var(--pr-lt),var(--br-lt))}
.pan-doc-pdf svg{width:36px;height:36px;margin-bottom:6px}
.pan-doc-pdf-label{font-size:11px;font-weight:700;letter-spacing:.3px}
.pan-doc-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;padding:8px 8px 6px;font-size:11px;font-weight:600;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pan-doc-delete{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;opacity:0;transition:opacity .2s ease}
.pan-doc-item:hover .pan-doc-delete{opacity:1}
@media(hover:none){.pan-doc-delete{opacity:1}}

/* Scanner Modal */
.scan-modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:#000;z-index:400;flex-direction:column}
.scan-modal.on{display:flex}
.scan-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(0,0,0,.5);color:#fff;flex-shrink:0}
.scan-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600}
.scan-title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.scan-pages-btn{background:var(--tx);color:var(--bg);border:none;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;min-width:56px}
.scan-body{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
#scan-video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#scan-overlay{position:absolute;top:0;left:0;pointer-events:none}
.scan-error{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:15px;padding:20px;text-align:center;z-index:6}
.scan-error.on{display:flex}
.scan-error-icon{font-size:48px}
.scan-error-btn{background:var(--tx);color:var(--bg);border:none;border-radius:100px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.scan-loading{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:15px;z-index:5}
.scan-loading.on{display:flex}
.scan-loading .spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
.scan-preview-wrap{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#000;align-items:center;justify-content:center;z-index:3}
.scan-preview-wrap.on{display:flex}
#scan-preview{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;cursor:grab}
#scan-preview:active{cursor:grabbing}
.scan-controls{display:flex;align-items:center;justify-content:space-around;padding:20px;background:rgba(0,0,0,.6);flex-shrink:0}
.scan-capture{width:70px;height:70px;border-radius:50%;background:transparent;border:4px solid #fff;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
.scan-capture:active{transform:scale(.92)}
.scan-capture-inner{width:100%;height:100%;background:#fff;border-radius:50%}
.scan-btn-secondary{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:100px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer}
.scan-done-bar{display:none;padding:16px 20px;gap:10px;background:#000;border-top:1px solid rgba(255,255,255,.1);flex-direction:column;flex-shrink:0}
.scan-done-bar.on{display:flex}
.scan-btn-full{background:var(--tx);color:var(--bg);border:none;border-radius:100px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer}
.scan-btn-alt{background:rgba(255,255,255,.15);color:#fff}

/* Doc viewer */
.doc-viewer{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:500;flex-direction:column}
.doc-viewer.on{display:flex}
.doc-viewer-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:rgba(0,0,0,.7);color:#fff;flex-shrink:0}
.doc-viewer-name{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.doc-viewer-action{background:var(--tx);color:var(--bg);border:none;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.doc-viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;background:#111}
.doc-viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.doc-viewer-body iframe{width:100%;height:100%;border:none;background:#fff;border-radius:8px}

/* Butoane actiuni in modal - Rezolvat + Send WA (stack vertical) */
.pan-actions{display:flex;flex-direction:column;gap:10px;padding:0 24px 20px}
.pan-rez-btn{width:100%;min-height:52px;padding:14px 20px;font-size:16px;border-radius:100px;box-sizing:border-box}
.pan-wa-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--br-lt);color:var(--t3);border:none;border-radius:100px;padding:14px 20px;font-size:16px;font-weight:700;cursor:not-allowed;min-height:52px;letter-spacing:-.2px;transition:background-color .3s ease,color .3s ease,transform .15s ease;box-sizing:border-box}

var SHARE_CODE = null;

// Persistenta status rezolvat in Firebase
function saveResolvedStatus(ticketNumber, resolved){
  if(!SHARE_CODE) return;
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/resolved.json';
  var payload = {};
  payload[ticketNumber] = resolved ? true : null;
  var xhr = new XMLHttpRequest();
  xhr.open('PATCH', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.send(JSON.stringify(payload));
}

function saveNerezolvatStatus(ticketNumber, nerezolvat){
  if(!SHARE_CODE) return;
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/nerezolvat.json';
  var payload = {};
  payload[ticketNumber] = nerezolvat ? true : null;
  var xhr = new XMLHttpRequest();
  xhr.open('PATCH', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.send(JSON.stringify(payload));
}

function s(v){ return (v||'').toString(); }

// Detecteaza numere de telefon RO (mobile 07XX si fix 02XX/03XX)
// Suporta formate: 0722 946 495, +40771209277, 0771-209-277
function extractPhones(text){
  if(!text) return [];
  var re = /(\+?40|0)[\s.-]?(7\d{2}|2\d{2}|3\d{2})[\s.-]?\d{3}[\s.-]?\d{3}/g;
  var matches = text.match(re) || [];
  var seen = {};
  var out = [];
  for(var i=0;i<matches.length;i++){
    var digits = matches[i].replace(/[^\d+]/g,'');
    // Normalizeaza la format +40
    if(digits.charAt(0)==='0') digits = '+40' + digits.substring(1);
    else if(digits.substring(0,2)==='40' && digits.charAt(0)!=='+') digits = '+' + digits;
    if(!seen[digits]){
      seen[digits] = true;
      out.push({ raw: matches[i], tel: digits });
    }
  }
  return out;
}

// Inlocuieste numerele de telefon din text cu link-uri tel: stilate
function linkifyPhones(text){
  if(!text) return '';
  return s(text).replace(/(\+?40|0)[\s.-]?(7\d{2}|2\d{2}|3\d{2})[\s.-]?\d{3}[\s.-]?\d{3}/g, function(match){
    var digits = match.replace(/[^\d+]/g,'');
    if(digits.charAt(0)==='0') digits = '+40' + digits.substring(1);
    else if(digits.substring(0,2)==='40' && digits.charAt(0)!=='+') digits = '+' + digits;
    return '<a href="tel:'+digits+'" class="phone-link" onclick="event.stopPropagation()">📞 '+match+'</a>';
  });
}

// Converteste data (numar serial Excel, timestamp JS ms, sau string) in dd.mm.yyyy hh:mm
// Daca e gol/invalid, intoarce "NA"
function fmtDate(v){
  if(v===null || v===undefined || v==='' || v==='NA') return 'NA';
  var d;
  if(typeof v === 'number' || (/^\d+(\.\d+)?$/).test(String(v))){
    var num = parseFloat(v);
    if(num > 1e10){
      // Timestamp JS millisecunde (Date.now)
      d = new Date(num);
    } else {
      // Serial Excel: (serial - 25569) * 86400000 = timestamp ms
      if(num < 1 || num > 100000) return 'NA';
      d = new Date(Math.round((num - 25569) * 86400 * 1000));
    }
  } else {
    d = new Date(v);
  }
  if(!d || isNaN(d.getTime())) return 'NA';
  var pad = function(n){ return n<10?'0'+n:''+n; };
  var dd = pad(d.getDate()), mm = pad(d.getMonth()+1), yy = d.getFullYear();
  var hh = pad(d.getHours()), mn = pad(d.getMinutes());
  var hasTime = hh!=='00' || mn!=='00';
  return dd+'.'+mm+'.'+yy + (hasTime ? ' '+hh+':'+mn : '');
}

function cp(txt, el){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ flash(el); }).catch(function(){ fb(txt); flash(el); });
  } else { fb(txt); flash(el); }
}
function fb(txt){ var t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.focus(); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }
function flash(el){ el.classList.add('copied'); setTimeout(function(){ el.classList.remove('copied'); }, 700); }

function openPanel(i, clickX, clickY){
  var r = DATA[i]; if(!r) return;
  CURRENT_PANEL_IDX = i;
  document.getElementById('ptitle').textContent = 'Ticket #' + s(r.t);
  updatePanelButtons();
  renderPanelDocs(s(r.t));
  var fields = [['Account',r.a,false],['Beneficiar',r.b,false],['Obiectiv',r.ob,false],['Localitate',r.l,false],['Adresă',r.ad,false],['Județ',r.j,false],['Tip',r.ty,true],['Notă',r.n,false],['Inițiere',fmtDate(r.d),false],['Programată',fmtDate(r.dp),false]];
  var html = '';
  // Contacte manuale (introduse din manager) - la inceput
  if(r.contacts && r.contacts.length > 0){
    var contactsHtml = '<div class="fr fr-phones"><span class="fl">📞 Contact</span><span class="fv fv-phones fv-contacts">';
    for(var ci=0;ci<r.contacts.length;ci++){
      var c = r.contacts[ci];
      if(!c.phone && !c.name) continue;
      var normalized = (c.phone||'').replace(/[^\d+]/g,'');
      if(normalized.charAt(0)==='0') normalized = '+40' + normalized.substring(1);
      else if(normalized.substring(0,2)==='40' && normalized.charAt(0)!=='+') normalized = '+' + normalized;
      var label = (c.name||'').trim() ? c.name + (c.phone ? ' · ' + c.phone : '') : c.phone;
      if(c.phone){
        contactsHtml += '<a href="tel:'+normalized+'" class="phone-btn phone-btn-contact">📞 '+label+'</a>';
      } else {
        contactsHtml += '<span class="phone-btn" style="background:var(--br-lt);color:var(--tx)">'+label+'</span>';
      }
    }
    // Buton + pentru adaugare din raport
    contactsHtml += '<button class="phone-btn phone-btn-add" onclick="openContactEditorReport('+i+')">+ Adaugă</button>';
    contactsHtml += '</span></div>';
    html += contactsHtml;
  } else {
    // Fara contacte inca - buton + pentru primul contact
    html += '<div class="fr fr-phones"><span class="fl">📞 Contact</span><span class="fv fv-phones"><button class="phone-btn phone-btn-add" onclick="openContactEditorReport('+i+')">+ Adaugă persoană contact</button></span></div>';
  }
  // Detecteaza telefoane in nota (si adresa/beneficiar ca fallback)
  var phones = extractPhones(s(r.n) + ' ' + s(r.ad) + ' ' + s(r.b));
  if(phones.length > 0){
    var phonesHtml = '<div class="fr fr-phones"><span class="fl">Sună (din notă)</span><span class="fv fv-phones">';
    for(var pi=0;pi<phones.length;pi++){
      phonesHtml += '<a href="tel:'+phones[pi].tel+'" class="phone-btn">📞 '+phones[pi].raw+'</a>';
    }
    phonesHtml += '</span></div>';
    html += phonesHtml;
  }
  for(var k=0;k<fields.length;k++){
    var lbl=fields[k][0], val=s(fields[k][1]), badge=fields[k][2], vh;
    // Sari peste datele NA (Inițiere/Programată)
    if((lbl==='Inițiere' || lbl==='Programată') && (val==='NA' || !val)) continue;
    if(!val){
      vh = (lbl==='Inițiere' || lbl==='Programată')
        ? '<span class="fv">NA</span>'
        : '<span class="fv em">—</span>';
    }
    else if(badge){ vh='<span class="fv"><span class="badge">'+val+'</span></span>'; }
    else if(lbl==='Notă'){
      // Nota: transforma telefoanele in link-uri clickable inline
      vh='<span class="fv fv-note">'+linkifyPhones(val).replace(/\n/g,'<br>')+'</span>';
    }
    else{ vh='<span class="fv" data-val="'+val.replace(/"/g,'&quot;')+'">'+val.replace(/\n/g,'<br>')+'</span>'; }
    html += '<div class="fr"><span class="fl">'+lbl+'</span>'+vh+'</div>';
    // Dupa Nota - adauga Info (daca exista) + buton edit
    if(lbl==='Notă'){
      if(r.info && r.info.trim()){
        html += '<div class="fr"><span class="fl">ℹ️ Info</span><span class="fv fv-note" style="background:rgba(255,193,7,.1);padding:8px 12px;border-radius:8px;border-left:3px solid #FFC107">'+linkifyPhones(r.info).replace(/\n/g,'<br>')+' <button class="phone-btn phone-btn-add phone-btn-small" onclick="openContactEditorReport('+i+')" style="margin-left:8px">✏️</button></span></div>';
      } else {
        html += '<div class="fr"><span class="fl">ℹ️ Info</span><span class="fv"><button class="phone-btn phone-btn-add" onclick="openContactEditorReport('+i+')">+ Adaugă notă/info</button></span></div>';
      }
    }
  }
  document.getElementById('pbody').innerHTML = html;
  document.querySelectorAll('#pbody .fv[data-val]').forEach(function(el){ el.onclick=function(){ cp(el.getAttribute('data-val'),el); }; });

  // BURST animation - deschide din punctul click-ului
  var pan = document.getElementById('pan');
  var ov = document.getElementById('ov');
  // Reset - inchide clip-path la 0
  ov.classList.remove('on');
  // Arata modal invizibil (opacity 0 via transition) ca sa masuram pan
  ov.style.display = 'flex';
  var rect = pan.getBoundingClientRect();
  var ox = (typeof clickX === 'number') ? (clickX - rect.left) : rect.width/2;
  var oy = (typeof clickY === 'number') ? (clickY - rect.top) : rect.height/2;
  // Raza maxima ca sa acopere tot modalul
  var maxR = Math.max(
    Math.sqrt(ox*ox + oy*oy),
    Math.sqrt((rect.width-ox)*(rect.width-ox) + oy*oy),
    Math.sqrt(ox*ox + (rect.height-oy)*(rect.height-oy)),
    Math.sqrt((rect.width-ox)*(rect.width-ox) + (rect.height-oy)*(rect.height-oy))
  );
  pan.style.setProperty('--burst-x', ox + 'px');
  pan.style.setProperty('--burst-y', oy + 'px');
  pan.style.setProperty('--burst-r', '0px');
  // Reset scroll
  pan.scrollTop = 0;
  // Force reflow apoi porneste animatia
  void pan.offsetWidth;
  ov.style.display = '';
  ov.className = 'on';
  // Seteaza raza finala (transition o va anima)
  requestAnimationFrame(function(){
    pan.style.setProperty('--burst-r', maxR + 'px');
  });
}

// Fetch docs pentru un ticket din Firebase, callback cu array (sau [])
function fetchTicketDocs(ticketNumber, cb){
  if(!SHARE_CODE){ cb([]); return; }
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/docs/' + encodeURIComponent(ticketNumber) + '.json';
  var xhr = new XMLHttpRequest();
  xhr.timeout = 5000;
  xhr.open('GET', url, true);
  xhr.onload = function(){
    var docs = [];
    try { var r = JSON.parse(xhr.responseText); if(Array.isArray(r)) docs = r; } catch(e){}
    cb(docs);
  };
  xhr.onerror = function(){ cb([]); };
  xhr.ontimeout = function(){ cb([]); };
  xhr.send();
}

var SORT_MODE = 'default';

function filtered(){
  var showOnlyUnresolved = false;
  var pf = document.getElementById('progressFilter');
  if(pf && pf.getAttribute('data-active')==='true') showOnlyUnresolved = true;

  var q = '';
  var si = document.getElementById('searchInput');
  if(si) q = (si.value||'').toLowerCase().trim();

  var result = DATA.filter(function(r){
    if(showOnlyUnresolved && (r._rezolvat || r._nerezolvat)) return false;
    if(activeType && (r.ty||'?')!==activeType) return false;
    if(activeLoc && (r.l||'')!==activeLoc) return false;
    if(q){
      var hay = (s(r.t)+' '+s(r.b)+' '+s(r.ob)+' '+s(r.ad)+' '+s(r.l)+' '+s(r.n)+' '+s(r.ty)).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  // Sortare
  var mode = SORT_MODE;
  if(mode === 'localitate'){
    result.sort(function(a,b){ return s(a.l).localeCompare(s(b.l),'ro') || s(a.t).localeCompare(s(b.t)); });
  } else if(mode === 'tip'){
    result.sort(function(a,b){ return s(a.ty).localeCompare(s(b.ty),'ro') || s(a.t).localeCompare(s(b.t)); });
  } else if(mode === 'data'){
    result.sort(function(a,b){
      var da = parseFloat(a.dp)||parseFloat(a.d)||0;
      var db = parseFloat(b.dp)||parseFloat(b.d)||0;
      if(da && db) return da - db;
      if(da) return -1;
      if(db) return 1;
      return 0;
    });
  } else if(mode === 'status'){
    result.sort(function(a,b){
      var ra = a._rezolvat?1:0, rb = b._rezolvat?1:0;
      return ra - rb;
    });
  }
  return result;
}

function updateProgress(){
  var total = DATA.length;
  var done = 0, rezolvate = 0, nerezolvate = 0;
  for(var i=0;i<DATA.length;i++){
    if(DATA[i]._rezolvat){ done++; rezolvate++; }
    else if(DATA[i]._nerezolvat){ done++; nerezolvate++; }
  }
  var pct = total>0 ? Math.round((done/total)*100) : 0;
  var textEl = document.getElementById('progressText');
  var fillEl = document.getElementById('progressFill');
  if(textEl){
    var txt = done+' din '+total+' finalizate ('+pct+'%)';
    if(nerezolvate > 0) txt += ' · '+rezolvate+' ✓ / '+nerezolvate+' ⚠';
    textEl.textContent = txt;
  }
  if(fillEl) fillEl.style.width = pct+'%';
}

function sendWAFromRow(i){
  var r = DATA[i];
  if(!r || (!r._rezolvat && !r._nerezolvat)) return;

function getLocalityCoords(loc){

function geocodeAll(src){
  var bounds = [];
  var listHtml = '';
  var locOffsets = {};

  for(var i=0; i<src.length; i++){
    var r = src[i];
    var color = COLORS[i % COLORS.length];

      '<span style="background:'+color+';color:#fff;border-radius:50%;width:36px;height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;align-self:flex-start;flex-shrink:0">'+(i+1)+'</span>'+

        '<div style="color:var(--t2);font-size:14px;margin-top:4px;line-height:1.35;word-break:break-word">'+s(r.ad)+', '+s(r.l)+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:stretch;justify-content:center">'+
        '<a href="'+gmUrl+'" target="_blank" onclick="event.stopPropagation()" style="background:#4285f4;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;text-decoration:none;text-align:center;min-width:70px">Maps</a>'+
        '<a href="'+wazeUrl+'" target="_blank" onclick="event.stopPropagation()" style="background:#33ccff;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;text-decoration:none;text-align:center;min-width:70px">Waze</a>'+
      '</div>'+
    '</div>';

    // Prefer coordonate exacte din date, fallback pe centrul localitatii
    if(r.lat && r.lng){
      addMarker(i, r, {lat: r.lat, lng: r.lng}, color, bounds);
    } else {
      var baseCoords = getLocalityCoords(s(r.l));
      if(baseCoords){
        var locKey = s(r.l).toUpperCase();
        if(!locOffsets[locKey]) locOffsets[locKey] = 0;
        var offset = locOffsets[locKey];
        locOffsets[locKey]++;
        var angle = offset * 0.7;
        var radius = 0.003 * offset;
        var coords = {
          lat: baseCoords[0] + radius * Math.cos(angle),
          lng: baseCoords[1] + radius * Math.sin(angle)
        };
        addMarker(i, r, coords, color, bounds);
      }
    }
  }

  document.getElementById('map-loading').style.display='none';
  document.getElementById('map-list').innerHTML = listHtml;
  if(bounds.length>0) leafletMap.fitBounds(bounds,{padding:[40,40]});

  document.querySelectorAll('.map-list-item').forEach(function(el){
    el.addEventListener('click',function(){
      var idx=parseInt(el.getAttribute('data-idx'));
      if(mapMarkers[idx]){ leafletMap.setView(mapMarkers[idx].getLatLng(),15); mapMarkers[idx].openPopup(); }
    });
  });
}

function addMarker(i,r,coords,color,bounds){
  bounds.push([coords.lat,coords.lng]);
  markerCoords[i] = {lat:coords.lat, lng:coords.lng};

      '<a href="waze://?q='+encodeURIComponent(addr)+'&navigate=yes" target="_blank" style="background:#33ccff;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;text-decoration:none">Waze</a>'+
    '</div>'+
  '</div>';
  var marker=L.marker([coords.lat,coords.lng],{icon:icon}).addTo(leafletMap).bindPopup(popup);
  mapMarkers[i]=marker;
}

// Distanta haversine intre 2 puncte lat/lng
function distKm(a, b){
  var R = 6371;
  var toRad = function(x){ return x * Math.PI / 180; };
  var dLat = toRad(b.lat - a.lat);
  var dLng = toRad(b.lng - a.lng);
  var s1 = Math.sin(dLat/2)*Math.sin(dLat/2) +
           Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat)) *
           Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(s1), Math.sqrt(1-s1));
}

// Nearest neighbor TSP (greedy, aproximativ)
function computeOptimalRoute(){
  var points = [];
  for(var i=0;i<markerCoords.length;i++){
    if(markerCoords[i]) points.push({idx:i, coords:markerCoords[i]});
  }
  if(points.length < 2) return [];
  var visited = {};
  var route = [points[0]];
  visited[points[0].idx] = true;
  var current = points[0];
  while(Object.keys(visited).length < points.length){
    var minDist = Infinity;
    var next = null;
    for(var j=0;j<points.length;j++){
      if(visited[points[j].idx]) continue;
      var d = distKm(current.coords, points[j].coords);
      if(d < minDist){ minDist = d; next = points[j]; }
    }
    if(!next) break;
    route.push(next);
    visited[next.idx] = true;
    current = next;
  }
  return route;
}

function toggleRoute(){
  if(!leafletMap) return;
  var btn = document.getElementById('mapOptimizeBtn');
  if(routeActive){
    if(routeLine){ leafletMap.removeLayer(routeLine); routeLine = null; }
    routeActive = false;
    if(btn) btn.textContent = '🧭 Optimizează traseu';
    return;
  }
  var route = computeOptimalRoute();
  if(route.length < 2){ alert('Ai nevoie de cel puțin 2 tickete cu coordonate pentru traseu'); return; }
  var totalKm = 0;
  var latlngs = [];
  for(var i=0;i<route.length;i++){
    latlngs.push([route[i].coords.lat, route[i].coords.lng]);
    if(i>0) totalKm += distKm(route[i-1].coords, route[i].coords);
  }
  routeLine = L.polyline(latlngs, {
    color: '#0369A1',
    weight: 4,
    opacity: 0.75,
    dashArray: '8, 8'
  }).addTo(leafletMap);
  routeActive = true;
  if(btn) btn.textContent = '✕ Ascunde traseu ('+totalKm.toFixed(1)+' km)';
  leafletMap.fitBounds(routeLine.getBounds(), {padding:[50,50]});
}

// Citire date: 1) ?v=code din Firebase 2) #d=base64 fallback 3) ?id= JSONP GAS legacy
function load(){
  var params = new URLSearchParams(window.location.search);
  var vCode = params.get('v');
  var id = params.get('id');
  var hash = window.location.hash;

  // Varianta 1: cod scurt Firebase ?v=cs09xxx
  if(vCode){
    SHARE_CODE = vCode;
    var fbUrl = FIREBASE_URL + '/t/' + encodeURIComponent(vCode) + '.json';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', fbUrl, true);
    xhr.timeout = 15000;
    xhr.onload = function(){
      if(xhr.status >= 200 && xhr.status < 300){
        try {
          var res = JSON.parse(xhr.responseText);
          if(res && res.data && Array.isArray(res.data) && res.data.length > 0){
            // Afiseaza data livrarii daca exista
            if(res.ts){
              var sub = document.getElementById('subtitle');
              if(sub) sub.innerHTML = 'Raport intervenții teren · <span style="color:var(--pr);font-weight:600">Livrat '+fmtDate(res.ts)+'</span>';
            }
            // Aplica statusurile rezolvate + nerezolvate persistate
            if(res.resolved && typeof res.resolved === 'object'){
              for(var k=0;k<res.data.length;k++){
                var tn = s(res.data[k].t);
                if(res.resolved[tn]) res.data[k]._rezolvat = true;
              }
            }
            if(res.nerezolvat && typeof res.nerezolvat === 'object'){
              for(var kn=0;kn<res.data.length;kn++){
                var tnn = s(res.data[kn].t);
                if(res.nerezolvat[tnn]) res.data[kn]._nerezolvat = true;
              }
            }
            // Extras (contacts + info adaugate din raport) - suprascriu ce vine din manager
            if(res.extra && typeof res.extra === 'object'){
              for(var ke=0;ke<res.data.length;ke++){
                var tne = s(res.data[ke].t);
                if(res.extra[tne]){
                  if(res.extra[tne].contacts) res.data[ke].contacts = res.extra[tne].contacts;
                  if(res.extra[tne].info) res.data[ke].info = res.extra[tne].info;
                }
              }
            }
            render(res.data);
            return;
          }
          document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Linkul a expirat sau nu conține date.</div>';
        } catch(e){
          document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Eroare date: '+e.message+'</div>';
        }
      } else {
        document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Firebase HTTP '+xhr.status+'</div>';
      }
    };
    xhr.ontimeout = function(){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">⏱️ Timeout Firebase.<br><br><button onclick="location.reload()" style="padding:8px 16px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer">🔄 Reîncearcă</button></div>';
    };
    xhr.onerror = function(){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Nu s-a putut conecta la Firebase</div>';
    };
    xhr.send();
    return;
  }

  // Varianta 2: datele in fragment #d=base64 (link lung, fara server)
  if(hash && hash.indexOf('#d=') === 0){
    try {
      var b64 = hash.substring(3);
      var jsonStr = decodeURIComponent(escape(atob(b64)));
      var data = JSON.parse(jsonStr);
      if(Array.isArray(data) && data.length > 0){
        render(data);
        return;
      }
    } catch(e){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date invalide în link: '+e.message+'</div>';
      return;
    }
  }

  // Varianta 3: fallback JSONP la GAS (legacy)
  if(!id){
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Link invalid</div>';
    return;
  }

  var ua = navigator.userAgent;
  var isEdge = /EdgA\//i.test(ua);
  if(isEdge){
    document.getElementById('root').innerHTML =
      '<div class="msg" style="color:#f44336;padding:30px">' +
        '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
        '<div style="font-size:16px;margin-bottom:12px"><b>Edge nu poate încărca datele pe Android</b></div>' +
        '<div style="font-size:14px;color:var(--t2);margin-bottom:20px">Deschide acest link în <b>Chrome</b>.</div>' +
        '<button onclick="copyCurrentUrl()" style="padding:10px 20px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">📋 Copiază linkul</button>' +
      '</div>';
    return;
  }

  var cbName = 'gasCb' + Math.floor(Math.random()*1000000);
  var url = SCRIPT_URL + '?id=' + encodeURIComponent(id) + '&callback=' + cbName;
  var handled = false;

  var timer = setTimeout(function(){
    if(handled) return;
    handled = true;
    try{ delete window[cbName]; }catch(e){}
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">⏱️ Timeout. Roagă expeditorul să trimită linkul cu date incluse.<br><br><button onclick="location.reload()" style="padding:8px 16px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer">🔄 Reîncearcă</button></div>';
  }, 20000);

  window[cbName] = function(data){
    if(handled) return;
    handled = true;
    clearTimeout(timer);
    try{ delete window[cbName]; }catch(e){}
    if(data && data.error){ document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date negăsite.</div>'; return; }
    if(Array.isArray(data) && data.length > 0){ render(data); return; }
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date invalide.</div>';
  };

  var sc = document.createElement('script');
  sc.src = url;
  document.body.appendChild(sc);
}

function copyCurrentUrl(){

  else {
    var t = document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);

var CV_LOADED = false;

function loadOpenCV(){
  return new Promise(function(resolve, reject){
    if(CV_LOADED){ resolve(); return; }
    if(CV_LOADING){
      var check = setInterval(function(){ if(CV_LOADED){ clearInterval(check); resolve(); } },200);
      return;
    }
    CV_LOADING = true;
    var loadingText = document.getElementById('scan-loading-text');

    // Load jscanify first
    function loadJscanify(cb){
      if(window.jscanify){ cb(); return; }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/gh/puffinsoft/jscanify@master/src/jscanify.min.js';
      s.onload = cb;
      s.onerror = function(){ reject('Nu s-a putut încărca jscanify'); };
      document.head.appendChild(s);
    }

    // Load OpenCV with fallback URLs
    function loadCV(urls, cb){
      if(urls.length === 0){ reject('Nu s-a putut încărca OpenCV de la niciun CDN'); return; }
      var url = urls.shift();
      if(loadingText) loadingText.textContent = 'Se încarcă motorul scanner (~8MB)...';
      var s = document.createElement('script');
      s.async = true;
      s.src = url;
      var done = false;
      s.onload = function(){
        // Wait up to 20s for cv.Mat to be defined
        var attempts = 0;
        var wait = setInterval(function(){
          attempts++;
          if(window.cv && window.cv.Mat){
            clearInterval(wait);
            done = true;
            CV_LOADED = true;
            cb();
          } else if(attempts > 200){ // 20s
            clearInterval(wait);
            if(!done) loadCV(urls, cb);
          } else if(loadingText && attempts % 10 === 0){
            loadingText.textContent = 'Se încarcă motorul scanner... ('+attempts/10+'s)';
          }
        }, 100);
      };
      s.onerror = function(){
        if(!done) loadCV(urls, cb);
      };
      document.head.appendChild(s);
    }

    loadJscanify(function(){
      loadCV([
        'https://docs.opencv.org/4.7.0/opencv.js',
        'https://docs.opencv.org/4.8.0/opencv.js',
        'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js'
      ], resolve);
    });
  });
}

function loadJsPDF(){
  return new Promise(function(resolve, reject){
    if(JSPDF_LOADED){ resolve(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = function(){ JSPDF_LOADED = true; resolve(); };
    s.onerror = function(){ reject('jsPDF load failed'); };
    document.head.appendChild(s);
  });
}

var edgeDetectionRAF = null;
function startEdgeDetection(){
  var video = document.getElementById('scan-video');
  var overlay = document.getElementById('scan-overlay');
  var ctx = overlay.getContext('2d');
  var scanner = new jscanify();

  function draw(){
    if(!video.videoWidth){ edgeDetectionRAF = requestAnimationFrame(draw); return; }
    // Match overlay to video display size
    var rect = video.getBoundingClientRect();
    overlay.width = rect.width;
    overlay.height = rect.height;
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';

    // Get highlight canvas from jscanify
    try {
      var highlighted = scanner.highlightPaper(video);
      // Draw scaled version
      ctx.clearRect(0,0,overlay.width,overlay.height);
      ctx.drawImage(highlighted, 0, 0, overlay.width, overlay.height);
    } catch(e){}
    edgeDetectionRAF = requestAnimationFrame(draw);
  }
  draw();
}

var scanRawCanvas = null;
var scanCorners = null; // {topLeft, topRight, bottomRight, bottomLeft} in raw coords
var scanFilterBW = false;
var scanDraggingCorner = -1;
var scanCanvasScale = 1; // display/raw ratio

function capturePage(){
  var video = document.getElementById('scan-video');
  if(!video.videoWidth) return;

  var raw = document.createElement('canvas');
  raw.width = video.videoWidth;
  raw.height = video.videoHeight;
  raw.getContext('2d').drawImage(video, 0, 0);
  scanRawCanvas = raw;

  scanCorners = detectCorners(raw);

  // IMPORTANT: mai intai facem preview vizibil, apoi masuram si desenam
  document.getElementById('scan-preview-wrap').classList.add('on');
  document.getElementById('scan-capture').style.display='none';
  document.getElementById('scan-retake').style.display='inline-block';
  document.getElementById('scan-accept').style.display='inline-block';
  document.getElementById('scan-filter-btn').style.display='inline-block';

  // Asteapta ca browserul sa aplice display:flex
  requestAnimationFrame(function(){
    showPreviewWithCorners();
  });
}

function detectCorners(rawCanvas){
  // Daca OpenCV nu e incarcat, foloseste defaults
  if(!window.cv || !window.cv.Mat || !window.jscanify){
    return defaultCorners(rawCanvas.width, rawCanvas.height);
  }
  try {
    var scanner = new jscanify();
    var mat = cv.imread(rawCanvas);
    var contour = scanner.findPaperContour(mat);
    if(!contour){
      mat.delete();
      return defaultCorners(rawCanvas.width, rawCanvas.height);
    }
    var pts = scanner.getCornerPoints(contour, mat);
    mat.delete();
    if(!pts || !pts.topLeftCorner){
      return defaultCorners(rawCanvas.width, rawCanvas.height);
    }
    return {
      topLeft: {x: pts.topLeftCorner.x, y: pts.topLeftCorner.y},
      topRight: {x: pts.topRightCorner.x, y: pts.topRightCorner.y},
      bottomRight: {x: pts.bottomRightCorner.x, y: pts.bottomRightCorner.y},
      bottomLeft: {x: pts.bottomLeftCorner.x, y: pts.bottomLeftCorner.y}
    };
  } catch(e){
    return defaultCorners(rawCanvas.width, rawCanvas.height);
  }
}

function defaultCorners(w, h){
  // Default: dreptunghi cu margine 10% (utilizatorul va ajusta)
  var mx = w * 0.1;
  var my = h * 0.1;
  return {
    topLeft: {x: mx, y: my},
    topRight: {x: w - mx, y: my},
    bottomRight: {x: w - mx, y: h - my},
    bottomLeft: {x: mx, y: h - my}
  };
}

function showPreviewWithCorners(){
  var previewCanvas = document.getElementById('scan-preview');
  var container = document.getElementById('scan-preview-wrap');
  var containerRect = container.getBoundingClientRect();
  var cw = containerRect.width || window.innerWidth;
  var ch = containerRect.height || (window.innerHeight - 200);

  var scale = Math.min(cw / scanRawCanvas.width, ch / scanRawCanvas.height);
  if(!scale || scale <= 0) scale = 0.5;
  scanCanvasScale = scale;
  var displayW = Math.round(scanRawCanvas.width * scale);
  var displayH = Math.round(scanRawCanvas.height * scale);

  previewCanvas.width = displayW;
  previewCanvas.height = displayH;
  previewCanvas.style.width = displayW + 'px';
  previewCanvas.style.height = displayH + 'px';

  var ctx = previewCanvas.getContext('2d');
  ctx.drawImage(scanRawCanvas, 0, 0, displayW, displayH);

  // Draw polygon connecting corners
  var c = scanCorners;
  ctx.strokeStyle = '#00E676';
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(0,230,118,0.15)';
  ctx.beginPath();
  ctx.moveTo(c.topLeft.x * scale, c.topLeft.y * scale);
  ctx.lineTo(c.topRight.x * scale, c.topRight.y * scale);
  ctx.lineTo(c.bottomRight.x * scale, c.bottomRight.y * scale);
  ctx.lineTo(c.bottomLeft.x * scale, c.bottomLeft.y * scale);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Draw corner handles
  var handleR = 18;
  ['topLeft','topRight','bottomRight','bottomLeft'].forEach(function(k){
    var p = c[k];
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#00E676';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x * scale, p.y * scale, handleR, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
  });
}

function getEventPos(ev, canvas){
  var rect = canvas.getBoundingClientRect();
  var clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
  var clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
  return {
    x: (clientX - rect.left) / scanCanvasScale,
    y: (clientY - rect.top) / scanCanvasScale
  };
}

function initCornerDragHandlers(){
  var canvas = document.getElementById('scan-preview');
  var cornerNames = ['topLeft','topRight','bottomRight','bottomLeft'];
  var HIT_R = 40; // hit radius in raw pixels

  function findCorner(pos){
    for(var i=0;i<cornerNames.length;i++){
      var p = scanCorners[cornerNames[i]];
      var dx = p.x - pos.x;
      var dy = p.y - pos.y;
      if(Math.sqrt(dx*dx+dy*dy) < HIT_R / scanCanvasScale) return i;
    }
    return -1;
  }

  function onStart(ev){
    if(!scanCorners) return;
    var pos = getEventPos(ev, canvas);
    scanDraggingCorner = findCorner(pos);
    if(scanDraggingCorner >= 0){ ev.preventDefault(); }
  }

  function onMove(ev){
    if(scanDraggingCorner < 0) return;
    ev.preventDefault();
    var pos = getEventPos(ev, canvas);
    // Clamp to canvas
    pos.x = Math.max(0, Math.min(scanRawCanvas.width, pos.x));
    pos.y = Math.max(0, Math.min(scanRawCanvas.height, pos.y));
    var name = cornerNames[scanDraggingCorner];
    scanCorners[name].x = pos.x;
    scanCorners[name].y = pos.y;
    showPreviewWithCorners();
  }

  function onEnd(){
    scanDraggingCorner = -1;
  }

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onEnd);
}

function acceptPage(){
  if(!scanRawCanvas || !scanCorners) return;

  var extracted;
  var hasCV = window.cv && window.cv.Mat && window.jscanify;

  if(hasCV){
    try {
      var scanner = new jscanify();
      extracted = scanner.extractPaper(scanRawCanvas, 2480, 3508, scanCorners);
    } catch(e){
      extracted = cropQuad(scanRawCanvas, scanCorners);
    }
    // B&W filter doar cu OpenCV
    if(scanFilterBW){
      extracted = applyBWFilter(extracted);
    }
  } else {
    // Fallback: crop simplu (fara perspectiva corectata)
    extracted = cropQuad(scanRawCanvas, scanCorners);
    if(scanFilterBW){
      // B&W simplu cu canvas 2D (fara adaptive threshold)
      extracted = applyBWFilterSimple(extracted);
    }
  }

  scanPages.push({ canvas: extracted, dataUrl: extracted.toDataURL('image/jpeg', 0.92) });
  scanRawCanvas = null;
  scanCorners = null;
  scanFilterBW = false;
  updateScanPagesBtn();

  document.getElementById('scan-preview-wrap').classList.remove('on');
  document.getElementById('scan-capture').style.display='flex';
  document.getElementById('scan-retake').style.display='none';
  document.getElementById('scan-accept').style.display='none';
  document.getElementById('scan-filter-btn').style.display='none';
  document.getElementById('scan-filter-btn').textContent = '☀ Original';
  document.getElementById('scan-done-bar').classList.add('on');
}

// B&W filter simplu (fara OpenCV) - luminozitate + contrast
function applyBWFilterSimple(canvas){
  var ctx = canvas.getContext('2d');
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var d = img.data;
  for(var i=0;i<d.length;i+=4){
    var gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    // Threshold la 128
    var v = gray > 128 ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function retakePage(){
  scanRawCanvas = null;
  scanCorners = null;
  scanFilterBW = false;
  document.getElementById('scan-preview-wrap').classList.remove('on');
  document.getElementById('scan-capture').style.display='flex';
  document.getElementById('scan-retake').style.display='none';
  document.getElementById('scan-accept').style.display='none';
  document.getElementById('scan-filter-btn').style.display='none';

}

function toggleFilter(){
  scanFilterBW = !scanFilterBW;
  var btn = document.getElementById('scan-filter-btn');
  btn.textContent = scanFilterBW ? '📄 B&W' : '☀ Original';
  btn.style.background = scanFilterBW ? '#fff' : 'rgba(255,255,255,.15)';
  btn.style.color = scanFilterBW ? '#000' : '#fff';
}

// B&W enhanced filter (ca CamScanner)
function applyBWFilter(canvas){
  try {
    var src = cv.imread(canvas);
    var gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    // Adaptive threshold pentru text pe hartie cu umbre
    var thresh = new cv.Mat();
    cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 25, 15);
    // Show on new canvas
    var out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    cv.imshow(out, thresh);
    src.delete(); gray.delete(); thresh.delete();
    return out;
  } catch(e){
    return canvas;
  }
}

// Fallback quad crop (nu are perspectiva corectata)
function cropQuad(canvas, corners){
  var minX = Math.min(corners.topLeft.x, corners.bottomLeft.x);
  var maxX = Math.max(corners.topRight.x, corners.bottomRight.x);
  var minY = Math.min(corners.topLeft.y, corners.topRight.y);
  var maxY = Math.max(corners.bottomLeft.y, corners.bottomRight.y);
  var w = maxX - minX;
  var h = maxY - minY;
  var out = document.createElement('canvas');
  out.width = w;
  out.height = h;
  out.getContext('2d').drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
  return out;
}

function updateScanPagesBtn(){
  var btn = document.getElementById('scan-pages-btn');
  btn.textContent = scanPages.length + ' pag';
  btn.style.background = scanPages.length > 0 ? 'var(--em)' : 'var(--tx)';
}

function closeScanner(){
  if(edgeDetectionRAF){ cancelAnimationFrame(edgeDetectionRAF); edgeDetectionRAF=null; }
  if(scanStream){
    scanStream.getTracks().forEach(function(t){ t.stop(); });
    scanStream = null;
  }
  document.getElementById('scan-modal').classList.remove('on');
  scanPages = [];
  window.__pendingScan = null;
}

// UPLOAD la Cloudinary
// ============================================================
function uploadToCloudinary(blob, filename){
  return new Promise(function(resolve, reject){
    var formData = new FormData();
    formData.append('file', blob, filename);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    // PDF-urile trebuie uploadate ca 'raw', imaginile ca 'image'
    var isPdf = /\.pdf$/i.test(filename);
    var resourceType = isPdf ? 'raw' : 'image';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/'+resourceType+'/upload', true);
    xhr.onload = function(){
      if(xhr.status >= 200 && xhr.status < 300){
        try {
          var res = JSON.parse(xhr.responseText);
          resolve(res);
        } catch(e){ reject('Parse: '+e.message); }
      } else {
        reject('HTTP '+xhr.status+': '+xhr.responseText);
      }
    };
    xhr.onerror = function(){ reject('Network error'); };
    xhr.send(formData);
  });
}

function saveDocRef(ticketNumber, doc){
  if(!SHARE_CODE) return;
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/docs/' + encodeURIComponent(ticketNumber) + '.json';
  // GET current list, append, PUT
  var xhr1 = new XMLHttpRequest();
  xhr1.open('GET', url, true);
  xhr1.onload = function(){
    var list = [];
    try { var r = JSON.parse(xhr1.responseText); if(Array.isArray(r)) list = r; } catch(e){}
    list.push(doc);
    var xhr2 = new XMLHttpRequest();
    xhr2.open('PUT', url, true);
    xhr2.setRequestHeader('Content-Type', 'application/json');
    xhr2.onload = function(){
      // Refresh docs display
      renderPanelDocs(ticketNumber);
    };
    xhr2.send(JSON.stringify(list));
  };
  xhr1.send();
}

function finishScan(format){
  if(scanPages.length === 0){ alert('Nu ai capturat nicio pagină'); return; }
  var t = s(currentScanTicket.t);
  var timestamp = new Date();
  var ts = timestamp.getFullYear() + ('0'+(timestamp.getMonth()+1)).slice(-2) + ('0'+timestamp.getDate()).slice(-2) + '_' + ('0'+timestamp.getHours()).slice(-2) + ('0'+timestamp.getMinutes()).slice(-2);
  var baseName = 'PV_' + t + '_' + ts;

  // Show upload progress
  var loading = document.getElementById('scan-loading');
  loading.classList.add('on');
  document.getElementById('scan-loading-text').textContent = 'Se salvează...';

  var uploads = [];
  if(format === 'pdf'){
    // Create PDF
    loadJsPDF().then(function(){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      for(var i=0;i<scanPages.length;i++){
        if(i>0) pdf.addPage();
        // A4 = 210mm x 297mm
        pdf.addImage(scanPages[i].dataUrl, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      }
      var blob = pdf.output('blob');
      var filename = baseName + '.pdf';
      uploadToCloudinary(blob, filename).then(function(res){
        saveDocRef(t, {
          url: res.secure_url,
          public_id: res.public_id,
          name: filename,
          size: blob.size,
          type: 'pdf',
          pages: scanPages.length,
          uploaded_at: Date.now()
        });
        loading.classList.remove('on');
        closeScanner();
      }).catch(function(err){
        loading.classList.remove('on');
        alert('Eroare upload: '+err);
      });
    });
  } else {
    // JPEG - upload each page separately
    var uploadNext = function(i){
      if(i >= scanPages.length){
        loading.classList.remove('on');
        closeScanner();
        return;
      }
      var pageName = baseName + (scanPages.length > 1 ? '_p'+(i+1) : '') + '.jpg';
      // Convert dataUrl to blob
      var dataUrl = scanPages[i].dataUrl;
      fetch(dataUrl).then(function(r){ return r.blob(); }).then(function(blob){
        return uploadToCloudinary(blob, pageName);
      }).then(function(res){
        saveDocRef(t, {
          url: res.secure_url,
          public_id: res.public_id,
          name: pageName,
          size: res.bytes,
          type: 'jpg',
          uploaded_at: Date.now()
        });
        uploadNext(i+1);
      }).catch(function(err){
        loading.classList.remove('on');
        alert('Eroare upload pag '+(i+1)+': '+err);
      });
    };
    uploadNext(0);
  }
}

// Afiseaza documentele salvate in modal
function renderPanelDocs(ticketNumber){
  if(!SHARE_CODE) return;
  var container = document.getElementById('pan-docs');
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/docs/' + encodeURIComponent(ticketNumber) + '.json';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onload = function(){
    var docs = [];
    try { var r = JSON.parse(xhr.responseText); if(Array.isArray(r)) docs = r; } catch(e){}
    if(docs.length === 0){ container.innerHTML = ''; return; }
    var html = '';
    for(var i=0;i<docs.length;i++){
      var d = docs[i];
      var isPdf = d.type === 'pdf' || (d.name||'').toLowerCase().endsWith('.pdf');
      var thumbHtml;
      if(isPdf){
        thumbHtml = '<div class="pan-doc-pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><div class="pan-doc-pdf-label">PDF · '+(d.pages||1)+' pag</div></div>';
      } else {
        // Cloudinary thumbnail transform: w_300,h_400,c_fill
        var thumbUrl = d.url.replace('/upload/', '/upload/w_300,h_400,c_fill,q_auto/');
        thumbHtml = '<img class="pan-doc-thumb" src="'+thumbUrl+'" alt="'+d.name+'">';
      }
      html += '<div class="pan-doc-item" data-doc-idx="'+i+'" data-ticket="'+ticketNumber+'">'+
        thumbHtml+
        '<div class="pan-doc-name">'+d.name+'</div>'+
        '<button class="pan-doc-delete" data-doc-idx="'+i+'" data-ticket="'+ticketNumber+'" title="Șterge">✕</button>'+
      '</div>';
    }
    container.innerHTML = html;
    // Wire clicks
    container.querySelectorAll('.pan-doc-item').forEach(function(el){
      el.onclick = function(e){
        if(e.target.classList.contains('pan-doc-delete')){
          if(!confirm('Ștergi acest document?')) return;
          var idx = parseInt(e.target.getAttribute('data-doc-idx'));
          var tn = e.target.getAttribute('data-ticket');
          deleteDoc(tn, idx);
          return;
        }
        var idx = parseInt(el.getAttribute('data-doc-idx'));
        openDocViewer(docs[idx]);
      };
    });
  };
  xhr.send();
}

function deleteDoc(ticketNumber, idx){
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/docs/' + encodeURIComponent(ticketNumber) + '.json';
  var xhr1 = new XMLHttpRequest();
  xhr1.open('GET', url, true);
  xhr1.onload = function(){
    var list = [];
    try { var r = JSON.parse(xhr1.responseText); if(Array.isArray(r)) list = r; } catch(e){}
    list.splice(idx, 1);
    var xhr2 = new XMLHttpRequest();
    xhr2.open('PUT', url, true);
    xhr2.setRequestHeader('Content-Type', 'application/json');
    xhr2.onload = function(){ renderPanelDocs(ticketNumber); };
    xhr2.send(JSON.stringify(list));
  };
  xhr1.send();
}

function openDocViewer(doc){
  var v = document.getElementById('doc-viewer');
  var body = document.getElementById('doc-viewer-body');
  document.getElementById('doc-viewer-name').textContent = doc.name;
  var dl = document.getElementById('doc-viewer-download');
  // Buton descarcare: descarca cu blob (forteaza salvare, nu deschide in browser)
  dl.href = '#';
  dl.onclick = function(e){
    e.preventDefault();
    downloadDocument(doc);
  };
  var isPdf = doc.type === 'pdf' || (doc.name||'').toLowerCase().endsWith('.pdf');
  if(isPdf){
    body.innerHTML = '<iframe src="'+doc.url+'#toolbar=0"></iframe>';
  } else {
    body.innerHTML = '<img src="'+doc.url+'" alt="'+doc.name+'">';
  }
  v.classList.add('on');
}

function downloadDocument(doc){
  var origText = document.getElementById('doc-viewer-download').textContent;
  document.getElementById('doc-viewer-download').textContent = '⏳ Descarcă...';
  // Cloudinary URL cu fl_attachment forteaza header attachment
  var url = doc.url.replace('/upload/', '/upload/fl_attachment/');
  fetch(url).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.blob();
  }).then(function(blob){
    var blobUrl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = blobUrl;
    a.download = doc.name || 'document';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 100);
    document.getElementById('doc-viewer-download').textContent = '✓ Descărcat';
    setTimeout(function(){ document.getElementById('doc-viewer-download').textContent = origText; }, 2000);
  }).catch(function(err){
    document.getElementById('doc-viewer-download').textContent = origText;
    // Fallback: deschide URL direct in tab nou (user poate salva manual)
    window.open(doc.url, '_blank');
    alert('Descărcare automată eșuată — poza s-a deschis în tab nou.\nApasă lung pe ea și alege "Salvează imagine".\n\nEroare: '+err.message);
  });
}

function closeDocViewer(){
  document.getElementById('doc-viewer').classList.remove('on');
  document.getElementById('doc-viewer-body').innerHTML = '';
}

// ============ EDITOR CONTACTE & INFO (Raport) ============
var CONTACT_EDIT_IDX = -1;

function openContactEditorReport(idx){
  var r = DATA[idx];
  if(!r) return;
  CONTACT_EDIT_IDX = idx;
  var contacts = r.contacts && r.contacts.length ? r.contacts.slice() : [];
  if(contacts.length === 0) contacts.push({name:'', phone:''});
  renderContactEditList(contacts);
  document.getElementById('contactEditInfo').value = r.info || '';
  document.getElementById('contactEdit').classList.add('on');
}

function renderContactEditList(contacts){
  var html = '';
  contacts.forEach(function(c, i){
    html += '<div class="contact-edit-row">'+
      '<input type="text" data-field="name" placeholder="Nume" value="'+(c.name||'').replace(/"/g,'&quot;')+'">'+
      '<input type="tel" data-field="phone" placeholder="07XX XXX XXX" value="'+(c.phone||'').replace(/"/g,'&quot;')+'">'+
      '<button class="contact-plus" onclick="addContactEditAt('+i+')" title="Adaugă alt contact">+</button>'+
      '<button class="contact-del" onclick="removeContactEdit('+i+')" title="Șterge">🗑️</button>'+
      '</div>';
  });
  document.getElementById('contactEditList').innerHTML = html;
}

function addContactEditAt(afterIdx){
  var current = getContactsFromEditUI();
  current.splice(afterIdx+1, 0, {name:'', phone:''});
  renderContactEditList(current);
  var rows = document.querySelectorAll('#contactEditList .contact-edit-row');
  if(rows[afterIdx+1]){ rows[afterIdx+1].querySelector('[data-field="name"]').focus(); }
}

function getContactsFromEditUI(){
  var contacts = [];
  var rows = document.querySelectorAll('#contactEditList .contact-edit-row');
  rows.forEach(function(row){
    var name = row.querySelector('[data-field="name"]').value.trim();
    var phone = row.querySelector('[data-field="phone"]').value.trim();
    if(name || phone) contacts.push({name: name, phone: phone});
  });
  return contacts;
}

function addContactEdit(){
  var current = getContactsFromEditUI();
  current.push({name:'', phone:''});
  renderContactEditList(current);
  var rows = document.querySelectorAll('#contactEditList .contact-edit-row');
  if(rows.length){ rows[rows.length-1].querySelector('[data-field="name"]').focus(); }
}

function removeContactEdit(idx){
  var current = getContactsFromEditUI();
  current.splice(idx, 1);
  if(current.length === 0) current.push({name:'', phone:''});
  renderContactEditList(current);
}

function saveContactEdit(){
  if(CONTACT_EDIT_IDX < 0) return;
  var r = DATA[CONTACT_EDIT_IDX];
  if(!r) return;
  r.contacts = getContactsFromEditUI();
  r.info = document.getElementById('contactEditInfo').value.trim();
  saveContactsToFirebase(s(r.t), r.contacts, r.info);
  var currentIdx = CURRENT_PANEL_IDX;
  closeContactEdit();
  if(currentIdx >= 0){ openPanel(currentIdx); }
}

function closeContactEdit(){
  document.getElementById('contactEdit').classList.remove('on');
  CONTACT_EDIT_IDX = -1;
}

function saveContactsToFirebase(ticketNumber, contacts, info){
  if(!SHARE_CODE) return;
  var url = FIREBASE_URL + '/t/' + encodeURIComponent(SHARE_CODE) + '/extra/' + encodeURIComponent(ticketNumber) + '.json';
  var payload = {};
  if(contacts && contacts.length) payload.contacts = contacts;
  if(info) payload.info = info;
  var xhr = new XMLHttpRequest();
  xhr.open('PUT', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.send(JSON.stringify(payload));
}

document.getElementById('contactEditClose').onclick = closeContactEdit;
document.getElementById('contactEditCancel').onclick = closeContactEdit;
document.getElementById('contactEditSave').onclick = saveContactEdit;
document.getElementById('contactAddBtn').onclick = addContactEdit;
document.getElementById('contactEdit').onclick = function(e){ if(e.target===this) closeContactEdit(); };
