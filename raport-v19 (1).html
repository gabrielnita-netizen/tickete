<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raport Tickete</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EFF6FB; --su:#FFFFFF;
  --tx:#0C2340; --t2:#5B7189; --t3:#9AAFC4;
  --br:#DDE8F1; --br-lt:#EDF3F8;
  --pr:#0369A1; --pr-lt:#DBEAFE;
  --em:#0EA5E9; --em-lt:#E0F2FE;
  --or:#F59E0B; --or-lt:#FEF3C7;
  --rd:#E11D48; --rd-lt:#FFE4E6;
  --bl:#0284C7; --bl-lt:#DBEAFE;
  --pk:#EC4899; --pk-lt:#FCE7F3;
  --pu:#7C3AED; --pu-lt:#EDE9FE;
  --yl:#EAB308; --yl-lt:#FEF9C3;
  --tl:#06B6D4; --tl-lt:#CFFAFE;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0A1929; --su:#132F4C;
  --tx:#E7EFF7; --t2:#7A93A8; --t3:#4A6072;
  --br:#1E3A5F; --br-lt:#173250;
  --pr:#38BDF8; --pr-lt:#0C4A6E;
  --em:#22D3EE; --em-lt:#0E7490;
  --or:#FBBF24; --or-lt:#78350F;
  --rd:#FB7185; --rd-lt:#881337;
  --bl:#60A5FA; --bl-lt:#1E3A8A;
  --pk:#F472B6; --pk-lt:#831843;
  --pu:#A78BFA; --pu-lt:#4C1D95;
  --yl:#FDE047; --yl-lt:#713F12;
  --tl:#22D3EE; --tl-lt:#164E63;
}}

body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;background:var(--bg);color:var(--tx);padding:24px 18px;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.wrap{max-width:900px;margin:0 auto}

h1{text-align:left;font-size:36px;font-weight:800;color:var(--tx);margin-bottom:6px;letter-spacing:-1.2px;line-height:1.1}
.subtitle{color:var(--t2);font-size:16px;margin-bottom:28px;font-weight:400;letter-spacing:-.2px}

/* Stats — playful cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.sc{padding:18px 16px;border-radius:22px;text-align:left;transition:transform .15s ease}
.sc:nth-child(1){background:var(--pr-lt)}
.sc:nth-child(2){background:var(--tl-lt)}
.sc:nth-child(3){background:var(--or-lt)}
.sc:active{transform:scale(.97)}
.sv{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.7px}
.sc:nth-child(1) .sv{color:var(--pr)}
.sc:nth-child(2) .sv{color:var(--tl)}
.sc:nth-child(3) .sv{color:var(--or)}
.sl{font-size:13px;color:var(--tx);margin-top:8px;font-weight:600;letter-spacing:-.1px;opacity:.75}

/* Buton harta — big rounded pill */
.map-btn{background:var(--tx);color:var(--bg);border:none;border-radius:20px;padding:18px 24px;font-size:17px;font-weight:700;cursor:pointer;width:100%;letter-spacing:-.3px;transition:all .15s ease;display:flex;align-items:center;justify-content:center;gap:10px}
.map-btn:active{transform:scale(.98);opacity:.85}

/* Section titles */
.sec{margin-bottom:28px}
.sec-title{font-size:22px;color:var(--tx);letter-spacing:-.5px;margin-bottom:14px;font-weight:800;text-transform:none}

/* Chip-uri categorii — colorate cu icon */
.cards{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--su);padding:14px 18px;border-radius:100px;border:none;cursor:pointer;transition:background-color .25s ease,color .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1);user-select:none;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.2px;min-height:48px}
.card:active{transform:scale(.92)}
.card.on{animation:chipPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes chipPop{
  0%{transform:scale(.9)}
  60%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.cv{font-size:14px;font-weight:800;color:var(--tx);background:var(--br-lt);padding:3px 10px;border-radius:100px;min-width:26px;text-align:center;letter-spacing:0;transition:background-color .2s ease,color .2s ease}
.card.on .cv{background:rgba(255,255,255,.3);color:currentColor}

/* Culori per tip ticket - ocean palette */
.card[data-type="instalare"]{background:var(--bl-lt);color:var(--bl)}
.card[data-type="instalare"].on{background:var(--bl);color:#fff}
.card[data-type="deconectare"]{background:var(--rd-lt);color:var(--rd)}
.card[data-type="deconectare"].on{background:var(--rd);color:#fff}
.card[data-type="service"]{background:var(--or-lt);color:#B45309}
.card[data-type="service"].on{background:var(--or);color:#fff}
.card[data-type="mesaj"]{background:var(--pu-lt);color:var(--pu)}
.card[data-type="mesaj"].on{background:var(--pu);color:#fff}
.card[data-type="conectare"]{background:var(--tl-lt);color:#0E7490}
.card[data-type="conectare"].on{background:var(--tl);color:#fff}
.card[data-type="offline"]{background:var(--yl-lt);color:#A16207}
.card[data-type="offline"].on{background:var(--yl);color:#fff}
.card[data-type="mentenanță"],.card[data-type="mentenanta"]{background:var(--pk-lt);color:var(--pk)}
.card[data-type="mentenanță"].on,.card[data-type="mentenanta"].on{background:var(--pk);color:#fff}
.card[data-type="reclamatie"],.card[data-type="reclamație"]{background:var(--rd-lt);color:var(--rd)}
.card[data-type="reclamatie"].on,.card[data-type="reclamație"].on{background:var(--rd);color:#fff}

/* Filtre localitate — navy ocean */
#locGrid .card{background:var(--pr-lt);color:var(--pr)}
#locGrid .card.on{background:var(--pr);color:#fff}
#locGrid .cv{background:rgba(3,105,161,.15);color:var(--pr)}
#locGrid .card.on .cv{background:rgba(255,255,255,.3);color:#fff}

/* Filter bar */
.fbar{display:none;background:var(--tl-lt);border-radius:16px;padding:14px 18px;margin-bottom:20px;font-size:15px;align-items:center;justify-content:space-between;gap:12px}
.fbar.on{display:flex}
.fbar span{color:#0E7490;font-weight:600;letter-spacing:-.2px}
.fbar button{background:var(--tx);border:none;border-radius:100px;padding:8px 16px;color:var(--bg);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:-.1px}

/* Tabel — pentru desktop */
.tw{background:var(--su);border-radius:22px;overflow:hidden}
.tw > div{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
thead{background:var(--br-lt)}
th{padding:16px 20px;text-align:left;font-weight:700;color:var(--t2);border-bottom:1px solid var(--br);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:16px 20px;border-bottom:1px solid var(--br-lt);color:var(--tx);letter-spacing:-.15px;font-weight:500}
tr:last-child td{border-bottom:none}
tr:active td{background:var(--br-lt)}

.tlink{color:var(--pr);cursor:pointer;font-weight:800;font-size:16px;text-decoration:none;letter-spacing:-.3px}
.tlink:active{opacity:.6}

/* BUTON REZOLVAT — pantry style pill */
.rezolvat-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or-lt);color:var(--or);border:none;border-radius:100px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:background-color .3s ease,color .3s ease,transform .15s ease;min-height:40px;white-space:nowrap;letter-spacing:-.2px}
.rezolvat-btn:active{transform:scale(.94)}
.rezolvat-btn.done{background:var(--em-lt);color:var(--em);animation:doneBounce .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes doneBounce{
  0%{transform:scale(1)}
  30%{transform:scale(.9)}
  60%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.rez-check{width:16px;height:16px;border:2px solid currentColor;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;transition:background-color .3s ease,border-color .3s ease}
.rezolvat-btn.done .rez-check{background:var(--em);border-color:var(--em)}
.rez-check-mark{display:none;color:#fff;font-size:10px;font-weight:900;line-height:1}
.rezolvat-btn.done .rez-check-mark{display:block;animation:checkPop .35s cubic-bezier(.34,1.8,.64,1) .1s both}
@keyframes checkPop{
  0%{transform:scale(0)}
  60%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

/* Rezolvat: doar butonul se schimba, nu tot randul */
tr.rezolvat td{background:transparent}

.cp{cursor:pointer}
.cp:active{background:var(--br-lt)!important}
.copied{color:var(--em)!important;font-weight:700!important}

.empty{text-align:center;padding:60px 20px;color:var(--t2);font-size:15px}
.msg{text-align:center;padding:100px 20px;color:var(--t2);font-size:17px;font-weight:500;letter-spacing:-.2px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--br);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal sheet — burst animation din punctul de click */
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,10,5,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);z-index:300;justify-content:center;align-items:center;padding:16px;opacity:0;transition:opacity .3s ease}
.modal-bg.on{display:flex;opacity:1}
#ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,10,5,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);z-index:100;justify-content:center;align-items:flex-end;padding:0;opacity:0;transition:opacity .35s ease}
#ov.on{display:flex;opacity:1}
#pan{background:var(--su);border-radius:28px 28px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;position:relative;
  --burst-x:50%;--burst-y:0;--burst-r:0;
  clip-path:circle(var(--burst-r) at var(--burst-x) var(--burst-y));
  -webkit-clip-path:circle(var(--burst-r) at var(--burst-x) var(--burst-y));
  transition:clip-path .55s cubic-bezier(.16,1,.3,1),-webkit-clip-path .55s cubic-bezier(.16,1,.3,1)}
#pan::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:5px;background:var(--br);border-radius:100px;opacity:.7}
#ov.on #pan{--burst-r:150%}
#ov.closing{opacity:0}
#pan.closing{transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
@media(min-width:640px){
  #pan.closing{transform:scale(.85);opacity:0;transition:transform .3s ease,opacity .3s ease}
}
@media(min-width:640px){
  #ov{align-items:center;padding:24px}
  #pan{border-radius:28px}
  #pan::before{display:none}
}
.ph{display:flex;justify-content:space-between;align-items:center;padding:26px 24px 18px;position:sticky;top:0;background:var(--su);z-index:2}
.ph h2{font-size:22px;color:var(--tx);font-weight:800;letter-spacing:-.5px}
.xb{background:var(--br-lt);border:none;font-size:16px;cursor:pointer;color:var(--t2);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;line-height:1;padding:0;transition:transform .15s ease}
.xb:active{background:var(--br);transform:scale(.9)}
.pb{padding:0 24px 24px}

/* Detalii ticket — rânduri cu fade stagger dupa burst */
.fr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--br-lt);opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease}
#ov.on .fr{opacity:1;transform:translateY(0)}
#ov.on .fr:nth-child(1){transition-delay:.35s}
#ov.on .fr:nth-child(2){transition-delay:.38s}
#ov.on .fr:nth-child(3){transition-delay:.41s}
#ov.on .fr:nth-child(4){transition-delay:.44s}
#ov.on .fr:nth-child(5){transition-delay:.47s}
#ov.on .fr:nth-child(6){transition-delay:.50s}
#ov.on .fr:nth-child(7){transition-delay:.53s}
#ov.on .fr:nth-child(8){transition-delay:.56s}
#ov.on .fr:nth-child(9){transition-delay:.59s}
#ov.on .fr:nth-child(10){transition-delay:.62s}
.fr:last-child{border-bottom:none}
.fl{font-size:15px;color:var(--t2);font-weight:500;flex-shrink:0;letter-spacing:-.15px;text-transform:none;padding-top:0;min-width:auto}
.fv{font-size:16px;line-height:1.5;word-break:break-word;cursor:pointer;color:var(--tx);font-weight:600;text-align:right;letter-spacing:-.2px}
.fv:active{color:var(--pr)}
.fv.em{color:var(--t3);cursor:default;font-weight:400}
.badge{display:inline-block;padding:5px 14px;border-radius:100px;background:var(--pr);color:#fff;font-weight:700;font-size:14px;letter-spacing:-.1px}

button{padding:10px 18px;border:none;border-radius:100px;background:var(--su);color:var(--pr);cursor:pointer;font-size:15px;font-weight:600}

/* MOBILE — cărți jucăușe */
@media(max-width:720px){
  body{padding:20px 16px}
  .tw{background:transparent;overflow:visible}
  .tw > div{overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:14px}
  tr{background:var(--su);border-radius:24px;padding:20px;border:none;position:relative}
  tr.rezolvat{background:var(--su)}
  td{padding:8px 0;border:none;display:flex;justify-content:space-between;align-items:center;gap:12px;letter-spacing:-.15px;font-size:16px;font-weight:600}
  .rowlbl{font-size:15px;color:var(--t2);font-weight:500;flex-shrink:0;letter-spacing:-.15px}
  td:first-child{padding-top:0;padding-bottom:8px;justify-content:flex-start}
  td:first-child .tlink{font-size:28px;font-weight:800;letter-spacing:-.7px}
  td:nth-child(2){padding-top:6px;padding-bottom:16px;border-bottom:1px solid var(--br-lt);margin-bottom:8px;justify-content:flex-start}
  td:nth-child(2) .rezolvat-btn{width:100%;padding:14px;font-size:15px;min-height:48px;border-radius:16px}
  td.cp{text-align:right}
  .cards{gap:10px}
  h1{font-size:32px;margin-bottom:4px}
  .subtitle{font-size:15px;margin-bottom:24px}
  .sv{font-size:28px}
  .sec-title{font-size:20px}
}
@media(min-width:721px){.rowlbl{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tickete</h1>
  <p class="subtitle">Raport intervenții teren</p>
  <div id="root"><div class="msg"><span class="spinner"></span>Se încarcă datele...</div></div>
</div>

<div id="ov">
  <div id="pan">
    <div class="ph"><h2 id="ptitle">Detalii</h2><button class="xb" id="xbtn">✕</button></div>
    <div class="pb" id="pbody"></div>
  </div>
</div>

<!-- WA Panel - apare dupa rezolvare -->
<div id="wa-panel" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;border-radius:12px;padding:14px 20px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:300;display:none;align-items:center;gap:12px;max-width:380px;width:90%">
  <span id="wa-text" style="font-size:13px;font-weight:500;flex:1"></span>
  <button id="wa-send-btn" style="background:#fff;color:#25D366;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap">💬 Send WA</button>
  <button id="wa-close-btn" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:0 4px">✕</button>
</div>

<!-- Map Modal -->
<div class="modal-bg" id="mapModal" style="z-index:300">
  <div style="background:var(--su);border-radius:12px;width:100%;max-width:960px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--br);flex-shrink:0">
      <h2 style="font-size:16px;color:var(--pr)">🗺️ Hartă Tickete</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="map-count" style="font-size:12px;color:var(--t2)"></span>
        <button onclick="closeMap()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2);padding:2px 6px">✕</button>
      </div>
    </div>
    <div id="map-container" style="flex:1;min-height:400px;position:relative">
      <div id="map-loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--t2);z-index:10">
        <div style="font-size:40px;margin-bottom:8px">🗺️</div>
        <div id="map-loading-text">Se încarcă harta...</div>
      </div>
      <div id="leaflet-map" style="width:100%;height:100%;min-height:400px"></div>
    </div>
    <div id="map-list" style="max-height:180px;overflow-y:auto;border-top:1px solid var(--br);flex-shrink:0"></div>
  </div>
</div>

<script>
var DATA = [];
var activeType = null;
var activeLoc = null;
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxG6PtyTahCGXBZpnKzhn45Man-magAfg85CfgGu-mWSTBqoXUhfqL13LT5-ppBZWqU/exec';
var FIREBASE_URL = 'https://tickete-jud-default-rtdb.europe-west1.firebasedatabase.app';
var SHEET_ID = '1feTSTO4FCFTUJBxiD0rd2ICF30jZE9pX6oihHxznkAY';

function s(v){ return (v||'').toString(); }

// Converteste data (numar serial Excel sau string) in format dd.mm.yyyy hh:mm
// Daca e gol/invalid, intoarce "NA"
function fmtDate(v){
  if(v===null || v===undefined || v==='' || v==='NA') return 'NA';
  var d;
  if(typeof v === 'number' || (/^\d+(\.\d+)?$/).test(String(v))){
    // Serial Excel: (serial - 25569) * 86400000 = timestamp ms
    var num = parseFloat(v);
    if(num < 1 || num > 100000) return 'NA';
    d = new Date(Math.round((num - 25569) * 86400 * 1000));
  } else {
    d = new Date(v);
  }
  if(!d || isNaN(d.getTime())) return 'NA';
  var pad = function(n){ return n<10?'0'+n:''+n; };
  var dd = pad(d.getDate()), mm = pad(d.getMonth()+1), yy = d.getFullYear();
  var hh = pad(d.getHours()), mn = pad(d.getMinutes());
  var hasTime = hh!=='00' || mn!=='00';
  return dd+'.'+mm+'.'+yy + (hasTime ? ' '+hh+':'+mn : '');
}

function cp(txt, el){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ flash(el); }).catch(function(){ fb(txt); flash(el); });
  } else { fb(txt); flash(el); }
}
function fb(txt){ var t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.focus(); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }
function flash(el){ el.classList.add('copied'); setTimeout(function(){ el.classList.remove('copied'); }, 700); }

// Panel detalii
function closePanel(){
  var ov = document.getElementById('ov');
  var pan = document.getElementById('pan');
  if(!ov.classList.contains('on')) return;
  pan.classList.add('closing');
  ov.classList.add('closing');
  setTimeout(function(){
    ov.className = '';
    pan.classList.remove('closing');
  }, 350);
}
var xbtnEl = document.getElementById('xbtn');
if(xbtnEl) xbtnEl.onclick = closePanel;
var ovEl = document.getElementById('ov');
if(ovEl) ovEl.onclick = function(e){ if(e.target===this) closePanel(); };

function openPanel(i, clickX, clickY){
  var r = DATA[i]; if(!r) return;
  document.getElementById('ptitle').textContent = 'Ticket #' + s(r.t);
  var fields = [['Account',r.a,false],['Beneficiar',r.b,false],['Obiectiv',r.ob,false],['Localitate',r.l,false],['Adresă',r.ad,false],['Județ',r.j,false],['Tip',r.ty,true],['Inițiere',fmtDate(r.d),false],['Programată',fmtDate(r.dp),false],['Notă',r.n,false]];
  var html = '';
  for(var k=0;k<fields.length;k++){
    var lbl=fields[k][0], val=s(fields[k][1]), badge=fields[k][2], vh;
    // Sari peste datele NA (Inițiere/Programată)
    if((lbl==='Inițiere' || lbl==='Programată') && (val==='NA' || !val)) continue;
    if(!val){
      vh = (lbl==='Inițiere' || lbl==='Programată')
        ? '<span class="fv">NA</span>'
        : '<span class="fv em">—</span>';
    }
    else if(badge){ vh='<span class="fv"><span class="badge">'+val+'</span></span>'; }
    else{ vh='<span class="fv" data-val="'+val.replace(/"/g,'&quot;')+'">'+val.replace(/\n/g,'<br>')+'</span>'; }
    html += '<div class="fr"><span class="fl">'+lbl+'</span>'+vh+'</div>';
  }
  document.getElementById('pbody').innerHTML = html;
  document.querySelectorAll('#pbody .fv[data-val]').forEach(function(el){ el.onclick=function(){ cp(el.getAttribute('data-val'),el); }; });

  // BURST animation - deschide din punctul click-ului
  var pan = document.getElementById('pan');
  var ov = document.getElementById('ov');
  // Reset - inchide clip-path la 0
  ov.classList.remove('on');
  // Arata modal invizibil (opacity 0 via transition) ca sa masuram pan
  ov.style.display = 'flex';
  var rect = pan.getBoundingClientRect();
  var ox = (typeof clickX === 'number') ? (clickX - rect.left) : rect.width/2;
  var oy = (typeof clickY === 'number') ? (clickY - rect.top) : rect.height/2;
  // Raza maxima ca sa acopere tot modalul
  var maxR = Math.max(
    Math.sqrt(ox*ox + oy*oy),
    Math.sqrt((rect.width-ox)*(rect.width-ox) + oy*oy),
    Math.sqrt(ox*ox + (rect.height-oy)*(rect.height-oy)),
    Math.sqrt((rect.width-ox)*(rect.width-ox) + (rect.height-oy)*(rect.height-oy))
  );
  pan.style.setProperty('--burst-x', ox + 'px');
  pan.style.setProperty('--burst-y', oy + 'px');
  pan.style.setProperty('--burst-r', '0px');
  // Reset scroll
  pan.scrollTop = 0;
  // Force reflow apoi porneste animatia
  void pan.offsetWidth;
  ov.style.display = '';
  ov.className = 'on';
  // Seteaza raza finala (transition o va anima)
  requestAnimationFrame(function(){
    pan.style.setProperty('--burst-r', maxR + 'px');
  });
}

// Panel rezolvat
function openRezolvat(i){
  var r = DATA[i]; if(!r) return;
  var idx = i;
  // Daca e deja rezolvat -> toggle inapoi la portocaliu (direct, fara confirm)
  if(r._rezolvat){
    DATA[idx]._rezolvat = false;

    return;

  // Marcheaza vizual imediat

}

function logToSheet(r, cb){
  if(!SHEET_ID){ if(cb) cb(false); return; }
  var ora = new Date().toLocaleString('ro-RO');
  var row = [s(r.t),s(r.b),s(r.ad),s(r.l),s(r.ty),fmtDate(r.dp),ora];
  var cbName = 'cbSheet'+Date.now();
  var url = SCRIPT_URL+'?action=sheet&sid='+encodeURIComponent(SHEET_ID)+'&row='+encodeURIComponent(JSON.stringify(row))+'&callback='+cbName;
  window[cbName] = function(data){
    delete window[cbName];
    if(cb) cb(data && data.ok);
  };
  var sc = document.createElement('script'); sc.src=url;
  sc.onerror=function(){ delete window[cbName]; if(cb) cb(false); };
  document.head.appendChild(sc);
}

var leafletMap = null;
var mapMarkers = [];
var geocodeCache = {};
var COLORS = ['#e74c3c','#e67e22','#f39c12','#2ecc71','#3498db','#9b59b6','#1abc9c','#e91e63'];

function openMap(){
  if(!DATA.length){ alert('Nu există date de afișat'); return; }
  var src = filtered();
  if(!src.length) src = DATA;
  document.getElementById('map-count').textContent = src.length + ' tickete';

    attribution:'© OpenStreetMap contributors', maxZoom:19
  }).addTo(leafletMap);
}

var LOC_COORDS = {
  'RESITA': [45.2969, 21.8897],
  'CARANSEBES': [45.4192, 22.2208],
  'BOCSA': [45.3736, 21.7411],
  'ORAVITA': [45.0361, 21.6892],
  'BAILE HERCULANE': [44.8797, 22.4142],
  'MOLDOVA NOUA': [44.7364, 21.6669],
  'OTELU ROSU': [45.5311, 22.3564],
  'ANINA': [45.0783, 21.8556],
  'TICVANIU MARE': [45.1500, 21.6167],
  'BOZOVICI': [44.9333, 22.0006],
  'RECAS': [45.8000, 21.5000],
  'ARAD': [46.1866, 21.3123],
  'TIMISOARA': [45.7489, 21.2087],
  'LUGOJ': [45.6886, 21.9031]
};

function getLocalityCoords(loc){
  var key = (loc||'').toUpperCase().trim();
  return LOC_COORDS[key] || null;
}

function geocodeAll(src){
  var bounds = [];
  var listHtml = '';
  var locOffsets = {};

  for(var i=0; i<src.length; i++){
    var r = src[i];
    var color = COLORS[i % COLORS.length];
    var addr = s(r.ad)+', '+s(r.l)+', Romania';
    var gmUrl = 'https://www.google.com/maps/search/'+encodeURIComponent(addr);
    var wazeUrl = 'https://waze.com/ul?q='+encodeURIComponent(addr);

    listHtml += '<div class="map-list-item" data-idx="'+i+'" style="display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--br);font-size:12px;cursor:pointer">'+
      '<span style="background:'+color+';color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">'+(i+1)+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s(r.t)+' — '+s(r.b)+'</div>'+
        '<div style="color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s(r.ad)+', '+s(r.l)+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:4px;flex-shrink:0;align-items:center">'+
        '<a href="'+gmUrl+'" target="_blank" onclick="event.stopPropagation()" style="background:#4285f4;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;text-decoration:none">Maps</a>'+
        '<a href="'+wazeUrl+'" target="_blank" onclick="event.stopPropagation()" style="background:#33ccff;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;text-decoration:none">Waze</a>'+
      '</div>'+
    '</div>';

    var baseCoords = getLocalityCoords(s(r.l));
    if(baseCoords){
      var locKey = s(r.l).toUpperCase();
      if(!locOffsets[locKey]) locOffsets[locKey] = 0;
      var offset = locOffsets[locKey];
      locOffsets[locKey]++;
      var angle = offset * 0.7;
      var radius = 0.003 * offset;
      var coords = {
        lat: baseCoords[0] + radius * Math.cos(angle),
        lng: baseCoords[1] + radius * Math.sin(angle)
      };
      addMarker(i, r, coords, color, bounds);
    }
  }

  document.getElementById('map-loading').style.display='none';
  document.getElementById('map-list').innerHTML = listHtml;
  if(bounds.length>0) leafletMap.fitBounds(bounds,{padding:[40,40]});

  document.querySelectorAll('.map-list-item').forEach(function(el){
    el.addEventListener('click',function(){
      var idx=parseInt(el.getAttribute('data-idx'));
      if(mapMarkers[idx]){ leafletMap.setView(mapMarkers[idx].getLatLng(),15); mapMarkers[idx].openPopup(); }
    });
  });
}

function addMarker(i,r,coords,color,bounds){
  bounds.push([coords.lat,coords.lng]);
  var icon=L.divIcon({
    className:'',
    html:'<div style="background:'+color+';color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+(i+1)+'</div>',
    iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]
  });
  var addr=s(r.ad)+', '+s(r.l)+', Romania';
  var popup='<div style="font-size:12px;min-width:200px">'+
    '<div style="font-weight:700;margin-bottom:4px">'+s(r.t)+'</div>'+
    '<div style="margin-bottom:2px"><b>'+s(r.b)+'</b></div>'+
    '<div style="color:#666;margin-bottom:4px">'+s(r.ad)+', '+s(r.l)+'</div>'+
    '<div style="margin-bottom:6px"><span style="background:#e8f0fe;color:#4285f4;border-radius:3px;padding:2px 6px">'+s(r.ty)+'</span></div>'+
    '<div style="display:flex;gap:6px">'+
      '<a href="https://www.google.com/maps/search/'+encodeURIComponent(addr)+'" target="_blank" style="background:#4285f4;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;text-decoration:none">Maps</a>'+
      '<a href="https://waze.com/ul?q='+encodeURIComponent(addr)+'" target="_blank" style="background:#33ccff;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;text-decoration:none">Waze</a>'+
    '</div>'+
  '</div>';
  var marker=L.marker([coords.lat,coords.lng],{icon:icon}).addTo(leafletMap).bindPopup(popup);
  mapMarkers[i]=marker;
}

// Citire date: 1) ?v=code din Firebase 2) #d=base64 fallback 3) ?id= JSONP GAS legacy
function load(){
  var params = new URLSearchParams(window.location.search);
  var vCode = params.get('v');
  var id = params.get('id');
  var hash = window.location.hash;

  // Varianta 1: cod scurt Firebase ?v=cs09xxx
  if(vCode){
    var fbUrl = FIREBASE_URL + '/t/' + encodeURIComponent(vCode) + '.json';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', fbUrl, true);
    xhr.timeout = 15000;
    xhr.onload = function(){
      if(xhr.status >= 200 && xhr.status < 300){
        try {
          var res = JSON.parse(xhr.responseText);
          if(res && res.data && Array.isArray(res.data) && res.data.length > 0){
            render(res.data);
            return;
          }
          document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Linkul a expirat sau nu conține date.</div>';
        } catch(e){
          document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Eroare date: '+e.message+'</div>';
        }
      } else {
        document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Firebase HTTP '+xhr.status+'</div>';
      }
    };
    xhr.ontimeout = function(){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">⏱️ Timeout Firebase.<br><br><button onclick="location.reload()" style="padding:8px 16px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer">🔄 Reîncearcă</button></div>';
    };
    xhr.onerror = function(){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Nu s-a putut conecta la Firebase</div>';
    };
    xhr.send();
    return;
  }

  // Varianta 2: datele in fragment #d=base64 (link lung, fara server)
  if(hash && hash.indexOf('#d=') === 0){
    try {
      var b64 = hash.substring(3);
      var jsonStr = decodeURIComponent(escape(atob(b64)));
      var data = JSON.parse(jsonStr);
      if(Array.isArray(data) && data.length > 0){
        render(data);
        return;
      }
    } catch(e){
      document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date invalide în link: '+e.message+'</div>';
      return;
    }
  }

  // Varianta 3: fallback JSONP la GAS (legacy)
  if(!id){
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Link invalid</div>';
    return;
  }

  var ua = navigator.userAgent;
  var isEdge = /EdgA\//i.test(ua);
  if(isEdge){
    document.getElementById('root').innerHTML =
      '<div class="msg" style="color:#f44336;padding:30px">' +
        '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
        '<div style="font-size:16px;margin-bottom:12px"><b>Edge nu poate încărca datele pe Android</b></div>' +
        '<div style="font-size:14px;color:var(--t2);margin-bottom:20px">Deschide acest link în <b>Chrome</b>.</div>' +
        '<button onclick="copyCurrentUrl()" style="padding:10px 20px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">📋 Copiază linkul</button>' +
      '</div>';
    return;
  }

  var cbName = 'gasCb' + Math.floor(Math.random()*1000000);
  var url = SCRIPT_URL + '?id=' + encodeURIComponent(id) + '&callback=' + cbName;
  var handled = false;

  var timer = setTimeout(function(){
    if(handled) return;
    handled = true;
    try{ delete window[cbName]; }catch(e){}
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">⏱️ Timeout. Roagă expeditorul să trimită linkul cu date incluse.<br><br><button onclick="location.reload()" style="padding:8px 16px;background:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer">🔄 Reîncearcă</button></div>';
  }, 20000);

  window[cbName] = function(data){
    if(handled) return;
    handled = true;
    clearTimeout(timer);
    try{ delete window[cbName]; }catch(e){}
    if(data && data.error){ document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date negăsite.</div>'; return; }
    if(Array.isArray(data) && data.length > 0){ render(data); return; }
    document.getElementById('root').innerHTML='<div class="msg" style="color:#f44336">❌ Date invalide.</div>';
  };

  var sc = document.createElement('script');
  sc.src = url;
  document.body.appendChild(sc);
}

function copyCurrentUrl(){
  var url = window.location.href;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ alert('Link copiat! Deschide-l în Chrome.'); });
  else {
    var t = document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
    alert('Link copiat!');
  }
}

load();
</script>
