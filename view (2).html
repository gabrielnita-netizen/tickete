<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Tickete - Raport</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #4a90e2; --bg: #f5f5f1; --surface: #fff; --text: #1a1a1a; --text2: #666; --border: #ddd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --surface: #2d2d2d; --text: #fff; --text2: #999; --border: #444; } }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 28px; color: var(--primary); margin-bottom: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--text2); margin-top: 8px; text-transform: uppercase; }
    .types-section { margin-bottom: 24px; }
    .types-title { font-size: 12px; margin-bottom: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .types-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .type-card { background: var(--surface); padding: 10px; border-radius: 6px; border: 1px solid var(--border); text-align: center; }
    .type-value { font-size: 20px; font-weight: 700; color: var(--primary); }
    .type-label { font-size: 11px; color: var(--text2); margin-top: 4px; text-transform: capitalize; }
    .table-wrapper { background: var(--surface); border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: rgba(74,144,226,0.05); position: sticky; top: 0; z-index: 10; }
    th { padding: 10px 12px; text-align: left; font-weight: 600; color: var(--primary); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: rgba(74,144,226,0.05); }
    .ticket-link { color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: underline; white-space: nowrap; }
    .ticket-link:hover { color: #357abd; }
    td.copyable { cursor: pointer; }
    td.copyable:hover { background: rgba(74,144,226,0.08); }
    .copied { background: rgba(76,175,80,0.2) !important; color: #4caf50 !important; }

    /* Modal */
    .modal-bg {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }
    .modal-header h2 { font-size: 16px; color: var(--primary); }
    .modal-close {
      background: none; border: none; font-size: 22px;
      cursor: pointer; color: var(--text2); line-height: 1;
      padding: 4px 8px; border-radius: 4px;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 16px 20px; }
    .field-row {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .field-row:last-child { border-bottom: none; }
    .field-label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      min-width: 130px;
      padding-top: 2px;
    }
    .field-value {
      font-size: 14px;
      color: var(--text);
      flex: 1;
      word-break: break-word;
      line-height: 1.5;
      cursor: pointer;
    }
    .field-value:hover { color: var(--primary); }
    .field-value.empty { color: var(--text2); font-style: italic; }
    .tip-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      background: rgba(74,144,226,0.15);
      color: var(--primary);
      font-size: 13px;
      font-weight: 500;
    }
    .msg { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 18px; }
    .err { color: #f44336; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h1>🎫 Raport Tickete</h1></div>
  <div id="content"><div class="msg">⏳ Se încarcă datele...</div></div>
</div>

<!-- Modal detalii ticket -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Detalii Ticket</h2>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  var allData = [];

  function getBinId() {
    try { return new URLSearchParams(window.location.search).get('bin'); }
    catch(e) { var m = window.location.search.match(/[?&]bin=([^&]+)/); return m ? m[1] : null; }
  }

  function showError(msg) {
    document.getElementById('content').innerHTML = '<div class="msg err">❌ ' + msg + '</div>';
  }

  function copyText(text, el) {
    var fn = function() {
      var orig = el.className;
      el.classList.add('copied');
      setTimeout(function() { el.className = orig; }, 700);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(fn).catch(function() { fallbackCopy(text); fn(); });
    } else { fallbackCopy(text); fn(); }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  function safe(v) { return v || ''; }

  function openTicket(idx) {
    var r = allData[idx];
    if (!r) return;

    document.getElementById('modalTitle').textContent = 'Ticket #' + safe(r.t);

    var fields = [
      { label: 'Numar ticket',    value: r.t },
      { label: 'Account',         value: r.a },
      { label: 'Beneficiara',     value: r.b },
      { label: 'Obiectiv',        value: r.ob },
      { label: 'Localitate',      value: r.l },
      { label: 'Adresa',          value: r.ad },
      { label: 'Judet',           value: r.j },
      { label: 'Tip ticket',      value: r.ty,  badge: true },
      { label: 'Data initiere',   value: r.d },
      { label: 'Data programata', value: r.dp },
      { label: 'Nota',            value: r.n }
    ];

    var html = fields.map(function(f) {
      var val = safe(f.value);
      var valHtml;
      if (!val) {
        valHtml = '<span class="field-value empty">—</span>';
      } else if (f.badge) {
        valHtml = '<span class="field-value"><span class="tip-badge">' + val + '</span></span>';
      } else {
        valHtml = '<span class="field-value copyable-field" onclick="copyFieldValue(this, \'' + val.replace(/'/g, "\\'").replace(/\n/g, ' ') + '\')">' + val.replace(/\n/g, '<br>') + '</span>';
      }
      return '<div class="field-row"><span class="field-label">' + f.label + '</span>' + valHtml + '</div>';
    }).join('');

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBg').classList.add('open');
  }

  function copyFieldValue(el, text) {
    copyText(text, el);
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalBg')) {
      document.getElementById('modalBg').classList.remove('open');
    }
  }

  function closeModalDirect() {
    document.getElementById('modalBg').classList.remove('open');
  }

  function renderPage(data) {
    if (!data || !data.length) { showError('Nu există date'); return; }
    allData = data;

    var accounts = {}, locations = {}, counts = {};
    data.forEach(function(r) {
      if (r.a) accounts[r.a] = 1;
      if (r.l) locations[r.l] = 1;
      var t = r.ty || '?';
      counts[t] = (counts[t] || 0) + 1;
    });

    var typesHtml = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).map(function(t) {
      return '<div class="type-card"><div class="type-value">' + counts[t] + '</div><div class="type-label">' + t + '</div></div>';
    }).join('');

    var rowsHtml = data.map(function(r, i) {
      return '<tr>' +
        '<td><span class="ticket-link" onclick="openTicket(' + i + ')">' + safe(r.t) + '</span></td>' +
        '<td class="copyable">' + safe(r.a) + '</td>' +
        '<td class="copyable">' + safe(r.b) + '</td>' +
        '<td class="copyable">' + safe(r.l) + '</td>' +
        '<td class="copyable">' + safe(r.ty) + '</td>' +
        '<td class="copyable">' + safe(r.d) + '</td>' +
        '<td class="copyable">' + safe(r.dp) + '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('content').innerHTML =
      '<div class="stats">' +
        '<div class="stat-card"><div class="stat-value">' + data.length + '</div><div class="stat-label">Total Tickete</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + Object.keys(accounts).length + '</div><div class="stat-label">Conturi</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + Object.keys(locations).length + '</div><div class="stat-label">Localități</div></div>' +
      '</div>' +
      '<div class="types-section"><div class="types-title">Tipuri de Tickete</div><div class="types-grid">' + typesHtml + '</div></div>' +
      '<div class="table-wrapper"><table>' +
        '<thead><tr>' +
          '<th>Ticket</th><th>Account</th><th>Beneficiara</th>' +
          '<th>Localitate</th><th>Tip</th><th>Data initiere</th><th>Data programata</th>' +
        '</tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
      '</table></div>';

    // Copy on click pentru celulele normale
    var cells = document.querySelectorAll('td.copyable');
    for (var i = 0; i < cells.length; i++) {
      (function(cell) {
        cell.addEventListener('click', function() {
          copyText(cell.textContent || cell.innerText, cell);
        });
      })(cells[i]);
    }
  }

  function loadData() {
    var binId = getBinId();
    if (!binId) { showError('Link invalid'); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.jsonbin.io/v3/b/' + binId + '/latest', true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try { renderPage(JSON.parse(xhr.responseText).record.data); }
        catch(e) { showError('Eroare la citire: ' + e.message); }
      } else {
        showError('Link invalid sau expirat (cod: ' + xhr.status + ')');
      }
    };
    xhr.onerror = function() { showError('Eroare de conexiune. Verifică internetul.'); };
    xhr.send();
  }

  loadData();
</script>
</body>
</html>
